
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Search · GoalLine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div style="display:flex;align-items:center"><a class="back" href="index.html" aria-label="Back">←</a><h1>Goal<span>Line</span></h1></div>
  <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
</header>
<div id="demoBanner" class="banner" hidden>Demo data. Tap ⚙️ and paste your football-data.org key to go live.</div>
<div class="sbox">
  <div class="field">
    <span>🔍</span>
    <input id="q" type="search" placeholder="Search teams, matches, leagues…" autocomplete="off" autofocus>
    <button id="clear" aria-label="Clear">✕</button>
  </div>
</div>
<div id="recent"></div>
<div id="hint" class="hint"></div>
<div id="teams" class="pad"></div>
<main id="results"></main>
<div id="settings" class="modal" hidden>
  <div class="box">
    <h2>Settings</h2>
    <p>Paste your free football-data.org API key to see real matches. It is saved only in this browser and is never uploaded. Leave empty for demo data.</p>
    <input id="keyInput" type="password" placeholder="API key" autocomplete="off">
    <div class="actions"><button id="cancelKey" class="btn">Cancel</button><button id="saveKey" class="btn primary">Save</button></div>
  </div>
</div>

<script src="data.js"></script>
<script src="demo.js"></script>
<script src="search.js"></script>
</body>
</html>
