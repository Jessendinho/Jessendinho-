<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Search · GoalLine</title>
<style>
:root {
  --bg: #0f1115;
  --card: #181b22;
  --line: #262a33;
  --text: #eef0f4;
  --muted: #8b92a1;
  --accent: #00d17a;
  --live: #ff4d4f;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: 72px;
  max-width: 640px;
  margin: 0 auto;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img.crest { width: 22px; height: 22px; object-fit: contain; }

.top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.top h1 { font-size: 22px; letter-spacing: -0.5px; }
.top h1 span { color: var(--accent); }
.icon-btn { font-size: 20px; opacity: .6; }
.icon-btn.on { opacity: 1; }
.banner { background: #2a2410; color: #f2c94c; font-size: 13px; padding: 8px 16px; }

.dates { display: flex; gap: 6px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.dates::-webkit-scrollbar { display: none; }
.date { flex: 0 0 auto; padding: 8px 12px; border-radius: 12px; background: var(--card); text-align: center; min-width: 58px; color: var(--muted); }
.date b { display: block; color: var(--text); font-size: 15px; }
.date small { font-size: 11px; text-transform: uppercase; }
.date.active { background: var(--accent); color: #04140c; }
.date.active b { color: #04140c; }

.group { margin: 0 12px 14px; background: var(--card); border-radius: 14px; overflow: hidden; }
.group h3 { font-size: 13px; padding: 10px 14px; color: var(--muted); border-bottom: 1px solid var(--line); font-weight: 600; }
.group h3 em { font-style: normal; color: var(--text); }
.match { display: grid; grid-template-columns: 56px 1fr 34px 28px; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.match:last-child { border-bottom: 0; }
.match:active { background: #1e222b; }
.time { font-size: 12px; color: var(--muted); text-align: center; }
.time.live { color: var(--live); font-weight: 700; }
.teams .t { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.teams .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.score div { padding: 2px 0; }
.score.live { color: var(--live); }
.star { font-size: 18px; color: var(--muted); }
.star.on { color: #ffc83d; }

.empty { text-align: center; color: var(--muted); padding: 48px 24px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.chip { flex: 0 0 auto; padding: 7px 14px; border-radius: 99px; background: var(--card); color: var(--muted); font-size: 13px; }
.chip.active { background: var(--accent); color: #04140c; font-weight: 600; }

table.tbl { width: calc(100% - 24px); margin: 0 12px; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; font-size: 13px; }
.tbl th { color: var(--muted); font-weight: 500; text-align: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.tbl td { text-align: center; padding: 9px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.team { text-align: left; display: flex; align-items: center; gap: 8px; }
.tbl td.pts { font-weight: 700; }
.tbl td.pos { color: var(--muted); width: 28px; }
.tbl tr.top4 td.pos { box-shadow: inset 3px 0 var(--accent); }

.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; display: flex; background: #12151b; border-top: 1px solid var(--line); z-index: 10; }
.tabs button { flex: 1; padding: 16px 0; color: var(--muted); font-weight: 600; }
.tabs button.active { color: var(--accent); }

.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet-body { background: var(--bg); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px 32px; position: relative; }
.close { position: absolute; top: 14px; right: 16px; font-size: 18px; color: var(--muted); }
.mh { text-align: center; padding: 8px 0 18px; }
.mh .comp { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.mh .row { display: flex; align-items: center; justify-content: center; gap: 18px; }
.mh .side { flex: 1; font-weight: 600; }
.mh .side img { width: 44px; height: 44px; display: block; margin: 0 auto 6px; }
.mh .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mh .st { margin-top: 8px; font-size: 13px; color: var(--muted); }
.mh .st.live { color: var(--live); font-weight: 700; }
.sec { background: var(--card); border-radius: 14px; margin-top: 14px; padding: 12px 14px; }
.sec h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 10px; }
.ev { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 6px; padding: 5px 0; font-size: 14px; }
.ev .m { text-align: center; color: var(--muted); font-size: 12px; align-self: center; }
.ev .h { text-align: right; }
.stat { margin: 12px 0; }
.stat .lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.stat .bar { display: flex; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.stat .bar i { background: var(--accent); }
.lu { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 13px; }
.lu div { padding: 2px 0; color: var(--muted); }
.lu b { color: var(--text); font-weight: 500; margin-right: 6px; }

.toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #04140c; padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 40; max-width: 92%; }
.toast[hidden] { display: none; }
a { color: inherit; text-decoration: none; }
.top .right { display: flex; gap: 14px; align-items: center; }
.back { font-size: 22px; padding-right: 10px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal[hidden] { display: none; }
.modal .box { background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; }
.modal h2 { font-size: 17px; margin-bottom: 8px; }
.modal p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.modal input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; margin-bottom: 12px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn { padding: 9px 16px; border-radius: 10px; background: var(--line); font-weight: 600; }
.btn.primary { background: var(--accent); color: #04140c; }
a.match { color: inherit; }
body.watch { padding-bottom: 24px; }
.refresh { text-align: center; color: var(--muted); font-size: 12px; padding: 14px 0 0; }
.field { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:0 14px; margin:0 16px; }
.field:focus-within { border-color:var(--accent); }
.field input { flex:1; background:none; border:0; outline:0; color:var(--text); font:inherit; font-size:16px; padding:14px 0; }
.field button { background:none; border:0; color:var(--muted); font-size:18px; cursor:pointer; display:none; }
.sbox { position:sticky; top:56px; background:var(--bg); padding:4px 0 8px; z-index:4; }
.hint { color:var(--muted); font-size:13px; padding:10px 16px 6px; }
.h4 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); padding:12px 16px 8px; display:flex; justify-content:space-between; }
.h4 button { background:none; border:0; color:var(--muted); font:inherit; text-transform:none; letter-spacing:0; cursor:pointer; }
.pad { padding:0 16px; }
.pad .chip { margin:0 6px 6px 0; }
.match.ns { grid-template-columns: 56px 1fr 34px; }
mark { background:rgba(0,209,122,.22); color:var(--text); border-radius:3px; padding:0 1px; }
</style>
</head>
<body>
<header class="top">
  <div style="display:flex;align-items:center"><a class="back" href="index.html" aria-label="Back">←</a><h1>Goal<span>Line</span></h1></div>
  <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
</header>
<div id="demoBanner" class="banner" hidden>Demo data. Tap ⚙️ and paste your football-data.org key to go live.</div>
<div class="sbox">
  <div class="field">
    <span>🔍</span>
    <input id="q" type="search" placeholder="Search teams, matches, leagues…" autocomplete="off" autofocus>
    <button id="clear" aria-label="Clear">✕</button>
  </div>
</div>
<div id="recent"></div>
<div id="hint" class="hint"></div>
<div id="teams" class="pad"></div>
<main id="results"></main>
<div id="settings" class="modal" hidden>
  <div class="box">
    <h2>Settings</h2>
    <p>Paste your free football-data.org API key to see real matches. It is saved only in this browser and is never uploaded. Leave empty for demo data.</p>
    <input id="keyInput" type="password" placeholder="API key" autocomplete="off">
    <div class="actions"><button id="cancelKey" class="btn">Cancel</button><button id="saveKey" class="btn primary">Save</button></div>
  </div>
</div>

<script>
/* ---------- Data layer: demo data by default, live football-data.org when a key is saved ---------- */
const COMPS = [
  { id: 2021, code: 'PL', name: 'Premier League', area: 'England' },
  { id: 2014, code: 'PD', name: 'La Liga', area: 'Spain' },
  { id: 2002, code: 'BL1', name: 'Bundesliga', area: 'Germany' },
  { id: 2019, code: 'SA', name: 'Serie A', area: 'Italy' },
  { id: 2015, code: 'FL1', name: 'Ligue 1', area: 'France' },
  { id: 2001, code: 'CL', name: 'Champions League', area: 'Europe' },
];
const API = 'https://api.football-data.org/v4';
const getKey = () => { try { return localStorage.getItem('gl_key') || ''; } catch { return ''; } };
const setKey = (k) => { try { k ? localStorage.setItem('gl_key', k) : localStorage.removeItem('gl_key'); } catch {} };
const isDemo = () => !getKey();

const memo = new Map();
async function live(path, ttl) {
  const hit = memo.get(path);
  if (hit && Date.now() - hit.t < ttl) return hit.d;
  let res;
  try { res = await fetch(API + path, { headers: { 'X-Auth-Token': getKey() } }); }
  catch { throw new Error('Could not reach football-data.org (network or browser CORS block).'); }
  if (!res.ok) {
    if (hit) return hit.d;
    throw new Error(res.status === 403 ? 'This competition is not included in the free plan.' :
      res.status === 429 ? 'Rate limit hit (10 requests/minute on the free plan). Wait a minute.' :
      res.status === 400 || res.status === 401 ? 'The API key was rejected. Check it in Settings.' : 'API error ' + res.status);
  }
  const d = await res.json();
  memo.set(path, { t: Date.now(), d });
  return d;
}
const normMatch = (m) => ({
  id: m.id, utcDate: m.utcDate, status: m.status, minute: m.minute ?? null,
  competition: { code: m.competition.code, name: m.competition.name, area: m.area?.name || m.competition.area?.name || '' },
  homeTeam: { id: m.homeTeam.id, name: m.homeTeam.shortName || m.homeTeam.name, crest: m.homeTeam.crest },
  awayTeam: { id: m.awayTeam.id, name: m.awayTeam.shortName || m.awayTeam.name, crest: m.awayTeam.crest },
  score: { fullTime: { home: m.score?.fullTime?.home ?? null, away: m.score?.fullTime?.away ?? null } },
});

/* ---- demo generator ---- */
const TEAMS = {
  PL: ['Arsenal','Chelsea','Liverpool','Man City','Man United','Tottenham','Newcastle','Aston Villa'],
  PD: ['Real Madrid','Barcelona','Atletico','Sevilla','Valencia','Villarreal','Betis','Girona'],
  BL1: ['Bayern','Dortmund','Leverkusen','Leipzig','Frankfurt','Stuttgart','Freiburg','Wolfsburg'],
  SA: ['Inter','Milan','Juventus','Napoli','Roma','Lazio','Atalanta','Fiorentina'],
  FL1: ['PSG','Marseille','Monaco','Lyon','Lille','Nice','Lens','Rennes'],
  CL: ['Arsenal','Real Madrid','Bayern','Inter','PSG','Barcelona','Liverpool','Dortmund'],
};
const tIds = {}; let nextT = 100;
const tid = (n) => (tIds[n] ??= nextT++);
const crest = (n) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='19' fill='hsl(${(tid(n) * 47) % 360},55%,45%)'/><text x='20' y='26' font-size='18' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>${n[0]}</text></svg>`);
const seeded = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
const dayNum = (d) => Math.floor(new Date(d + 'T00:00:00Z').getTime() / 86400000);

function demoMatches(date) {
  const rnd = seeded(dayNum(date)); const now = Date.now(); const out = []; let id = dayNum(date) * 100;
  COMPS.forEach((c) => {
    if (rnd() < 0.25) return;
    const pool = TEAMS[c.code].slice(); const n = 1 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const h = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
      const a = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
      const hour = 12 + Math.floor(rnd() * 9), min = rnd() < 0.5 ? '00' : '30';
      const ko = new Date(`${date}T${String(hour).padStart(2, '0')}:${min}:00Z`);
      const el = (now - ko.getTime()) / 60000;
      let status = 'TIMED', hs = null, as = null, minute = null;
      if (el > 115) status = 'FINISHED'; else if (el >= 0) status = el > 45 && el < 60 ? 'PAUSED' : 'IN_PLAY';
      if (status !== 'TIMED') {
        const r2 = seeded(id + 7); hs = 0; as = 0;
        const goals = Math.floor((Math.min(el, 90) / 90) * (1 + r2() * 4));
        for (let g = 0; g < goals; g++) (r2() < 0.52 ? hs++ : as++);
        minute = Math.min(90, Math.floor(el > 60 ? el - 15 : el));
      }
      out.push({ id: id++, utcDate: ko.toISOString(), status, minute: status === 'IN_PLAY' ? minute : null,
        competition: { code: c.code, name: c.name, area: c.area },
        homeTeam: { id: tid(h), name: h, crest: crest(h) }, awayTeam: { id: tid(a), name: a, crest: crest(a) },
        score: { fullTime: { home: hs, away: as } } });
    }
  });
  return out.sort((x, y) => x.utcDate.localeCompare(y.utcDate));
}
function demoStandings(code) {
  const rnd = seeded(code.split('').reduce((a, c) => a + c.charCodeAt(0), 0));
  const rows = (TEAMS[code] || []).map((name) => {
    const won = Math.floor(rnd() * 7), draw = Math.floor(rnd() * (8 - won)), lost = 8 - won - draw;
    const gf = won * 2 + draw + Math.floor(rnd() * 4), ga = lost * 2 + draw + Math.floor(rnd() * 3);
    return { team: { id: tid(name), name, crest: crest(name) }, playedGames: 8, won, draw, lost, goalsFor: gf, goalsAgainst: ga, goalDifference: gf - ga, points: won * 3 + draw };
  }).sort((a, b) => b.points - a.points || b.goalDifference - a.goalDifference);
  rows.forEach((r, i) => (r.position = i + 1)); return rows;
}
function demoMatch(id) {
  const date = new Date(Math.floor(id / 100) * 86400000).toISOString().slice(0, 10);
  const m = demoMatches(date).find((x) => x.id === id); if (!m) return null;
  const r = seeded(id), P = ['Silva','Martinez','Kane','Rodri','Haaland','Salah','Vinicius','Osimhen','Lewandowski','Mbappe'];
  const pick = () => P[Math.floor(r() * P.length)], h = m.score.fullTime.home || 0, a = m.score.fullTime.away || 0, events = [];
  for (let i = 0; i < h; i++) events.push({ minute: 5 + Math.floor(r() * 85), type: 'GOAL', team: 'home', player: pick() });
  for (let i = 0; i < a; i++) events.push({ minute: 5 + Math.floor(r() * 85), type: 'GOAL', team: 'away', player: pick() });
  if (m.status !== 'TIMED') events.push({ minute: 20 + Math.floor(r() * 60), type: 'YELLOW', team: r() < .5 ? 'home' : 'away', player: pick() });
  events.sort((x, y) => x.minute - y.minute);
  const sh = (s) => Math.max(1, Math.round(s * 4 + r() * 6));
  return { ...m, events, lineups: null, stats: m.status === 'TIMED' ? null : { possession: [50 + Math.round((r() - .5) * 30)], shots: [sh(h), sh(a)], corners: [Math.floor(r() * 9), Math.floor(r() * 9)], fouls: [5 + Math.floor(r() * 10), 5 + Math.floor(r() * 10)] } };
}

/* ---- public API used by the pages ---- */
const Data = {
  async matches(date) {
    if (isDemo()) return demoMatches(date);
    const next = new Date(new Date(date + 'T00:00:00Z').getTime() + 86400000).toISOString().slice(0, 10);
    return (await live(`/matches?dateFrom=${date}&dateTo=${next}`, 30000)).matches.map(normMatch);
  },
  async standings(code) {
    if (isDemo()) return demoStandings(code);
    const d = await live(`/competitions/${code}/standings`, 300000);
    const t = d.standings.find((s) => s.type === 'TOTAL') || d.standings[0];
    return (t?.table || []).map((r) => ({ ...r, team: { id: r.team.id, name: r.team.shortName || r.team.name, crest: r.team.crest } }));
  },
  async match(id) {
    if (isDemo()) { const m = demoMatch(id); if (!m) throw new Error('Match not found'); return m; }
    const g = await live(`/matches/${id}`, 20000);
    const side = (t) => (t === g.homeTeam.id ? 'home' : 'away');
    const lu = (t) => ({ formation: t.formation || null, starting: (t.lineup || []).map((p) => ({ name: p.name, number: p.shirtNumber })) });
    return { ...normMatch(g),
      events: [...(g.goals || []).map((x) => ({ minute: x.minute, type: 'GOAL', team: side(x.team?.id), player: x.scorer?.name || '' })),
        ...(g.bookings || []).map((x) => ({ minute: x.minute, type: x.card === 'RED' ? 'RED' : 'YELLOW', team: side(x.team?.id), player: x.player?.name || '' }))].sort((a, b) => a.minute - b.minute),
      lineups: { home: lu(g.homeTeam), away: lu(g.awayTeam) }, stats: null };
  },
};

/* ---- shared helpers ---- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LIVE = ['IN_PLAY', 'PAUSED', 'LIVE'];
function timeLabel(m) {
  if (m.status === 'FINISHED') return { t: 'FT', live: false };
  if (m.status === 'PAUSED') return { t: 'HT', live: true };
  if (LIVE.includes(m.status)) return { t: m.minute ? `${m.minute}'` : 'LIVE', live: true };
  if (m.status === 'POSTPONED') return { t: 'PPD', live: false };
  return { t: new Date(m.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), live: false };
}
const loadJ = (k, d) => { try { return JSON.parse(localStorage.getItem('gl_' + k)) ?? d; } catch { return d; } };
const saveJ = (k, v) => { try { localStorage.setItem('gl_' + k, JSON.stringify(v)); } catch {} };
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* Settings dialog (API key) */
function initSettings() {
  const modal = $('#settings'); if (!modal) return;
  const refresh = () => { const b = $('#demoBanner'); if (b) b.hidden = !isDemo(); };
  $('#settingsBtn').onclick = () => { $('#keyInput').value = getKey(); modal.hidden = false; };
  $('#cancelKey').onclick = () => (modal.hidden = true);
  $('#saveKey').onclick = () => { setKey($('#keyInput').value.trim()); modal.hidden = true; location.reload(); };
  refresh();
}

(() => {
  const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let all = [], ready = false;

  const recent = () => loadJ('recent', []);
  const addRecent = (t) => { t = t.trim(); if (t.length > 1) saveJ('recent', [t, ...recent().filter((x) => x.toLowerCase() !== t.toLowerCase())].slice(0, 6)); };
  const mark = (text, words) => {
    let o = esc(text);
    words.forEach((w) => { if (w) o = o.replace(new RegExp('
