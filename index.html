<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00ff85">
<link rel="manifest" href="manifest.json">
<title>GoalLine LIVE | By Jessendinho</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Inter,Arial,sans-serif}
header{background:#111;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px}.logo span{color:#00ff85}.by{font-size:10px;color:#888;letter-spacing:2px;display:block}
.search{flex:1;margin:0 12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:8px 14px;color:#fff;width:100%;max-width:280px}
#status{background:#00ff85;color:#000;text-align:center;padding:7px;font-weight:800;font-size:12px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#0f0f0f;scrollbar-width:none}
.chip{white-space:nowrap;padding:6px 14px;border-radius:20px;background:#1a1a1a;border:1px solid #2a2a2a;font-size:12px;cursor:pointer}
.chip.active{background:#00ff85;color:#000;font-weight:800;border-color:#00ff85}
#games{padding:12px 12px 90px;min-height:60vh}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.card:active{transform:scale(.98)}
.card.fav{border-color:#ffcc00}
.league{font-size:10px;color:#777;text-transform:uppercase;display:flex;justify-content:space-between}
.live-dot{width:8px;height:8px;background:red;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1} 50%{opacity:.3} 100%{opacity:1}}
.match{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.team{flex:1;font-size:14px;font-weight:600}
.team.away{text-align:right}
.score{background:#00ff85;color:#000;padding:5px 12px;border-radius:8px;font-weight:900;min-width:56px;text-align:center;margin:0 8px}
.vs{color:#444;margin:0 8px;font-size:12px}
.star{font-size:18px;margin-left:8px;color:#333}
.star.on{color:#ffcc00}
.empty{text-align:center;color:#555;margin-top:80px;line-height:1.8;padding:20px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;border-top:1px solid #222;z-index:20}
.tab{flex:1;padding:14px 4px;text-align:center;color:#666;font-size:12px;font-weight:800;cursor:pointer}
.tab.active{color:#00ff85;border-top:2px solid #00ff85}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:50;padding:20px}
.modal.open{display:flex;align-items:center;justify-content:center}
.box{background:#1a1a1a;border-radius:16px;padding:20px;width:100%;max-width:380px;border:1px solid #2a2a2a}
.btn{width:100%;padding:12px;background:#00ff85;color:#000;border:none;border-radius:10px;font-weight:900;margin-top:12px;cursor:pointer}
.btn2{background:#222;color:#fff}
.date-input{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<header>
<div><div class="logo">Goal<span>Line</span></div><span class="by">BY JESSENDINHO</span></div>
<input class="search" id="search" placeholder="Search team, league..." oninput="doSearch()">
<div style="display:flex;gap:8px;align-items:center">
<input type="date" id="datePick" class="date-input" onchange="loadByDate()">
<button onclick="loadGames(currentTab)" style="background:none;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:8px">↻</button>
</div>
</header>
<div id="status">✅ Connected to old-poetry - LIVE scores active!</div>
<div class="filters" id="filters"></div>
<div id="games"><div class="empty">Loading...</div></div>
<div class="tabs">
<div class="tab" id="t-fav" onclick="switchTab('fav')">⭐ Fav</div>
<div class="tab active" id="t-today" onclick="switchTab('today')">Today</div>
<div class="tab" id="t-live" onclick="switchTab('live')"><span class="live-dot"></span> LIVE</div>
<div class="tab" id="t-yesterday" onclick="switchTab('yesterday')">Yesterday</div>
</div>

<div class="modal" id="modal" onclick="closeModal(event)">
<div class="box" id="box"></div>
</div>

<script>
const WORKER = "https://old-poetry-cb6d.jessegitonga04.workers.dev";
let currentTab='today';
let allFixtures=[];
let favTeams = JSON.parse(localStorage.getItem('gl_fav')||'[]');
const leagues = ['All','Kenya PL','EPL','La Liga','MLS','UCL','Copa'];

function initFilters(){
  const f=document.getElementById('filters');
  f.innerHTML=leagues.map(l=>`<div class="chip ${l==='All'?'active':''}" onclick="filterLeague(this,'${l}')">${l}</div>`).join('');
  document.getElementById('datePick').value=getDateStr(0);
}
function filterLeague(el,name){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  render(allFixtures,name);
}
function getDateStr(off=0){
  const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().split('T')[0];
}
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
  loadGames(t);
}
function doSearch(){
  const q=document.getElementById('search').value.toLowerCase();
  if(!q) return render(allFixtures);
  render(allFixtures.filter(f=> (f.teams.home.name+' '+f.teams.away.name+' '+f.league.name).toLowerCase().includes(q)));
}
function loadByDate(){
  const d=document.getElementById('datePick').value;
  loadGames('custom',d);
}
async function loadGames(type,customDate){
  const c=document.getElementById('games');
  c.innerHTML='<div class="empty">Loading '+type+'...</div>';
  let url='';
  if(type==='live') url=`${WORKER}/v3/fixtures?live=all`;
  else if(type==='today') url=`${WORKER}/v3/fixtures?date=${getDateStr(0)}`;
  else if(type==='yesterday') url=`${WORKER}/v3/fixtures?date=${getDateStr(-1)}`;
  else if(type==='fav') { renderFav(); return; }
  else url=`${WORKER}/v3/fixtures?date=${customDate}`;
  try{
    const r=await fetch(url); const j=await r.json();
    allFixtures=j.response||[];
    render(allFixtures);
  }catch(e){ c.innerHTML=`<div class="empty">Error: ${e.message}<br>Worker: old-poetry</div>`}
}
function renderFav(){
  const c=document.getElementById('games');
  if(!favTeams.length){ c.innerHTML='<div class="empty">No favorites yet.<br>Tap ⭐ on any match to add!<br><br>⭐ Gor Mahia<br>⭐ Arsenal<br>⭐ FC Dallas</div>'; return; }
  const filtered = allFixtures.filter(f=> favTeams.includes(f.teams.home.name) || favTeams.includes(f.teams.away.name));
  if(!filtered.length) c.innerHTML='<div class="empty">No fav teams playing today.<br>Showing all teams as sample.</div>';
  render(allFixtures.filter(f=> favTeams.includes(f.teams.home.name) || favTeams.includes(f.teams.away.name)).length? allFixtures.filter(f=> favTeams.includes(f.teams.home.name) || favTeams.includes(f.teams.away.name)) : allFixtures);
}
function toggleFav(team,e){
  e.stopPropagation();
  if(favTeams.includes(team)) favTeams=favTeams.filter(t=>t!==team);
  else favTeams.push(team);
  localStorage.setItem('gl_fav',JSON.stringify(favTeams));
  render(allFixtures);
}
function render(list, leagueFilter='All'){
  const c=document.getElementById('games');
  let filtered=list;
  if(leagueFilter!=='All'){
    filtered=list.filter(f=>{
      const ln=f.league.name.toLowerCase();
      if(leagueFilter==='EPL') return ln.includes('premier league');
      if(leagueFilter==='La Liga') return ln.includes('la liga');
      if(leagueFilter==='MLS') return ln.includes('major league');
      if(leagueFilter==='Kenya PL') return ln.includes('kenya');
      if(leagueFilter==='UCL') return ln.includes('champions');
      if(leagueFilter==='Copa') return ln.includes('copa')||ln.includes('libertadores');
      return true;
    });
  }
  if(!filtered.length){ c.innerHTML=`<div class="empty">No games in ${leagueFilter}<br>Try All or LIVE</div>`; return; }
  c.innerHTML='';
  filtered.slice(0,80).forEach(f=>{
    const isFav = favTeams.includes(f.teams.home.name) || favTeams.includes(f.teams.away.name);
    const league=f.league.name; const minute=f.fixture.status.elapsed? f.fixture.status.elapsed+"'" : f.fixture.status.short;
    const isLive=['1H','2H','HT'].includes(f.fixture.status.short);
    const home=f.teams.home.name, away=f.teams.away.name;
    const gh=f.goals.home??'-', ga=f.goals.away??'-';
    const showScore=f.fixture.status.short!=='NS';
    c.innerHTML+=`<div class="card ${isFav?'fav':''}" onclick="openModal('${home}','${away}','${league}','${gh}-${ga}','${minute}')">
      <div class="league"><span>${league} • ${minute} ${isLive?'<span class=live-dot></span>':''}</span><span><span class="star ${isFav?'on':''}" onclick="toggleFav('${home.replace(/'/g,"")} ',event)">⭐</span></span></div>
      <div class="match"><div class="team">${home}</div>${showScore?`<div class="score">${gh} - ${ga}</div>`:'<div class=vs>vs</div>'}<div class="team away">${away}</div></div>
    </div>`;
  });
}
function openModal(h,a,l,s,m){
  document.getElementById('modal').classList.add('open');
  document.getElementById('box').innerHTML=`<h3>${h} vs ${a}</h3><p style="color:#888;margin:8px 0">${l} • ${m}</p><div style="font-size:32px;font-weight:900;text-align:center;margin:16px 0;color:#00ff85">${s}</div><button class="btn" onclick="navigator.share?navigator.share({title:'GoalLine',text:'${h} ${s} ${a} - GoalLine LIVE',url:location.href}):alert('Link copied!')">Share Score</button><button class="btn btn2" onclick="closeModal()">Close</button><div style="text-align:center;color:#555;font-size:10px;margin-top:12px">Powered by old-poetry • By Jessendinho</div>`;
}
function closeModal(e){ if(!e || e.target.id==='modal') document.getElementById('modal').classList.remove('open'); }

initFilters(); loadGames('today');
setInterval(()=>{ if(currentTab==='live') loadGames('live'); },60000);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
