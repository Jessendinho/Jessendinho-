<html lang="en">
<head><style>

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}

  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalLine LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:bold}
.logo span{color:#00ff88}
.badge{background:#00ff88;color:#000;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-left:8px}
#status{background:#00ff88;color:#000;text-align:center;padding:8px;font-size:13px;font-weight:bold}
#games{padding:16px;padding-bottom:80px;min-height:60vh}
.card{background:#1a1a1a;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid #2a2a2a}
.league{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase}
.match{display:flex;justify-content:space-between;align-items:center}
.team{flex:1}
.team.away{text-align:right}
.score{margin:0 12px;background:#00ff88;color:#000;padding:4px 10px;border-radius:6px;font-weight:bold;min-width:50px;text-align:center}
.vs{margin:0 12px;color:#666}
.time{font-size:11px;color:#00ff88;margin-top:4px}
.empty{text-align:center;color:#666;margin-top:80px;line-height:1.6}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;border-top:1px solid #222}
.tab{flex:1;padding:16px;text-align:center;color:#666;cursor:pointer;font-weight:bold}
.tab.active{color:#00ff88;border-top:2px solid #00ff88}
.btn{background:none;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo">Goal<span>Line</span><span class="badge">LIVE</span></div>
<button class="btn" onclick="loadGames(currentTab)">↻ Refresh</button>
</header>
<div id="status">✅ Connected to old-poetry - LIVE scores active!</div>
<div id="games"><div class="empty">Loading games...</div></div>
<div class="tabs">
<div class="tab active" id="tab-today" onclick="switchTab('today')">Today</div>
<div class="tab" id="tab-live" onclick="switchTab('live')">LIVE</div>
<div class="tab" id="tab-yesterday" onclick="switchTab('yesterday')">Yesterday</div>
</div>
<script>
const WORKER = "https://old-poetry-cb6d.jessegitonga04.workers.dev";
let currentTab = 'today';

function getDateStr(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return d.toISOString().split('T')[0];
}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  loadGames(t);
}

async function loadGames(type){
  const container = document.getElementById('games');
  container.innerHTML = '<div class="empty">Loading '+type+' games...</div>';
  let url='';
  if(type==='live') url = `${WORKER}/v3/fixtures?live=all`;
  else if(type==='today') url = `${WORKER}/v3/fixtures?date=${getDateStr(0)}`;
  else url = `${WORKER}/v3/fixtures?date=${getDateStr(-1)}`;
  
  try{
    const res = await fetch(url);
    const data = await res.json();
    const fixtures = data.response || [];
    
    if(!fixtures.length){
      container.innerHTML = `<div class="empty">No ${type} games found.<br>Try LIVE or Yesterday</div>`;
      return;
    }
    
    container.innerHTML='';
    fixtures.slice(0,50).forEach(f=>{
      const league = f.league?.name || 'League';
      const home = f.teams?.home?.name || 'Home';
      const away = f.teams?.away?.name || 'Away';
      const gh = f.goals?.home ?? '-';
      const ga = f.goals?.away ?? '-';
      const status = f.fixture?.status?.short || 'NS';
      const minute = f.fixture?.status?.elapsed ? f.fixture.status.elapsed + "'" : status;
      
      const isLive = ['1H','2H','HT','ET','LIVE'].includes(status);
      const scoreDisplay = status==='NS' ? '<span class="vs">vs</span>' : `<span class="score">${gh} - ${ga}</span>`;
      
      container.innerHTML += `
        <div class="card">
          <div class="league">${league} • ${minute}</div>
          <div class="match">
            <div class="team">${home}</div>
            ${scoreDisplay}
            <div class="team away">${away}</div>
          </div>
          ${isLive ? '<div class="time">● LIVE</div>' : ''}
        </div>
      `;
    });
  }catch(e){
    container.innerHTML = `<div class="empty">Error loading games<br><small>${e.message}</small><br><br>Check worker: old-poetry-cb6d</div>`;
    console.error(e);
  }
}

loadGames('today');
setInterval(()=>{ if(currentTab==='live') loadGames('live'); }, 60000);
</script>
