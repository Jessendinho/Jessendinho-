<style>
:root{--green:#0a2e1c;--green2:#123d26;--gold:#e8b84b;--dark:#080808;--card:#121212;--card2:#1a1a1a;--border:#1e3d2a;--text:#fff;--muted:#888}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:var(--dark);color:var(--text)}
header{background:var(--green);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.logo{font-weight:900;font-size:20px;line-height:1}.je{color:var(--gold)}.scores{color:#fff}
.logo small{display:block;font-size:7px;letter-spacing:1.5px;color:var(--gold);font-weight:700;margin-top:2px}
.slogan{font-size:7px;color:var(--gold);font-style:italic}
.hdr-right{display:flex;gap:8px;align-items:center}
.live-badge{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;background:#ff3b3b;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.date-tabs{background:#0f0f0f;display:flex;gap:0;overflow:auto;padding:0 10px;border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:90}
.date-tabs::-webkit-scrollbar{display:none}
.dt{padding:12px 14px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.dt.on{color:var(--text);border-bottom-color:var(--gold)}
#main{padding:8px;padding-bottom:90px}
.league-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.league-head{background:var(--card2);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.league-head b{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.arrow{color:var(--muted)}.arrow.open{transform:rotate(180deg)}
.match-row{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-bottom:1px solid #141414;cursor:pointer}
.match-row:hover{background:rgba(232,184,75,.05)}
.team-left,.team-right{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.team-left{justify-content:flex-end;text-align:right}
.team-right{justify-content:flex-start}
.team-logo{width:20px;height:20px;background:#0f0f0f;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.team-logo img{width:100%;height:100%;object-fit:contain}
.center{width:60px;text-align:center;font-size:12px;font-weight:800}
.center .score{color:var(--gold);background:#000;border:1px solid var(--border);border-radius:6px;padding:2px 6px}
.center .status{font-size:9px;color:var(--muted);margin-top:2px}
.following-card{background:linear-gradient(135deg,var(--green),var(--green2));border:1px solid var(--gold);border-radius:12px;margin-bottom:12px;overflow:hidden}
.following-head{padding:10px 12px;display:flex;justify-content:space-between;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(232,184,75,.2)}
.following-head b{color:var(--gold);font-size:13px}
.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 8px;z-index:100}
.nav{flex:1;text-align:center;font-size:9px;color:var(--muted);font-weight:700;cursor:pointer}
.nav.on{color:var(--gold)}
.nav span{font-size:18px;display:block;margin-bottom:2px}
/* Match Detail Modal - FotMob style */
#detail{position:fixed;inset:0;background:var(--dark);z-index:200;display:none;flex-direction:column}
#detail.show{display:flex}
.detail-header{background:var(--green);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold)}
.detail-header b{font-size:14px;color:#fff}
.detail-header b span{color:var(--gold)}
.close{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:rgba(0,0,0,.3);color:var(--gold);font-size:18px;cursor:pointer}
.scoreboard{background:var(--card);padding:16px 12px;text-align:center;border-bottom:1px solid var(--border)}
.teams{display:flex;justify-content:space-around;align-items:center}
.team-box{flex:1;text-align:center}
.team-box img{width:50px;height:50px;object-fit:contain;background:#0f0f0f;border-radius:50%;padding:5px}
.team-box div{font-size:13px;font-weight:800;margin-top:6px}
.score-box{font-size:28px;font-weight:900;color:var(--gold);background:#000;border:1px solid var(--border);border-radius:10px;padding:6px 14px;min-width:80px}
.match-status{font-size:10px;color:var(--muted);margin-top:8px}
.tabs{display:flex;gap:5px;padding:8px;background:#0a0a0a;border-bottom:1px solid var(--border)}
.tb{flex:1;padding:8px;border-radius:8px;background:#1a1a1a;color:#777;font-size:10px;font-weight:800;text-align:center;cursor:pointer;border:1px solid #222}
.tb.on{background:var(--gold);color:#000;border-color:var(--gold)}
.content{flex:1;overflow:auto;padding:12px;font-size:12px}
.lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lineup-team{background:#121212;border:1px solid var(--border);border-radius:10px;padding:10px}
.lineup-team b{color:var(--gold);font-size:11px;display:block;margin-bottom:6px}
.player{font-size:11px;padding:4px 0;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between}
.stat-row{padding:8px 0;border-bottom:1px solid #1a1a1a}
.stat-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.bar{height:6px;background:#1a1a1a;border-radius:3px;display:flex;margin-top:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold)}
.bar-fill.opp{background:#333}
.event{padding:8px 0;border-bottom:1px solid #1a1a1a;display:flex;gap:10px;font-size:11px}
.event-time{font-weight:800;color:var(--gold);min-width:30px}
.btn{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.btnGold{background:var(--gold);color:#000;border-color:var(--gold)}
</style>
</head>
<body>
<header>
<div class="logo"><span class="je">je</span><span class="scores">Scores</span><small>BY JESSENDINHO</small><div class="slogan">Every Goal. Every Update.</div></div>
<div class="hdr-right"><div class="live-badge"><span class="dot"></span> Live</div></div>
</header>
<div class="date-tabs" id="dateTabs"></div>
<div id="main"></div>
<div class="bottom">
<div class="nav on"><span>⚽</span>Matches</div>
<div class="nav" onclick="alert('News coming')"><span>📰</span>News</div>
<div class="nav" onclick="alert('Leagues coming')"><span>🏆</span>Leagues</div>
<div class="nav" onclick="loadFollowingPage()"><span>⭐</span>Following</div>
<div class="nav"><span>☰</span>More</div>
</div>

<div id="detail">
<div class="detail-header"><b id="detailTitle">jeScores • Match • <span>Every Goal. Every Update.</span></b><button class="close" onclick="closeDetail()">×</button></div>
<div class="scoreboard" id="scoreboard"></div>
<div class="tabs">
<div class="tb on" id="tb-lineup" onclick="setTab('lineup')">Lineup</div>
<div class="tb" id="tb-stats" onclick="setTab('stats')">Stats</div>
<div class="tb" id="tb-events" onclick="setTab('events')">Events</div>
<div class="tb" id="tb-h2h" onclick="setTab('h2h')">H2H</div>
</div>
<div class="content" id="detailContent"></div>
</div>

<input type="date" id="d" style="position:absolute;opacity:0;pointer-events:none">

<script>
var W="https://old-poetry-cb6d.jessegitonga04.workers.dev";
var games=[],curDate=new Date(),collapsed={},curMatch=null,curTab='lineup';

function buildDateTabs(){
 var tabs=document.getElementById('dateTabs');
 var html='';
 for(var i=-2;i<=5;i++){
  var d=new Date();d.setDate(d.getDate()+i);
  var label='';
  if(i==-1) label='Yesterday';
  else if(i==0) label='Today';
  else if(i==1) label='Tomorrow';
  else label=d.toLocaleDateString('en-GB',{weekday:'short'})+' '+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'});
  var isOn=d.toDateString()==curDate.toDateString();
  html+='<div class="dt '+(isOn?'on':'')+'" onclick="setDate('+i+')">'+label+'</div>';
 }
 tabs.innerHTML=html;
}
function setDate(offset){
 var d=new Date();d.setDate(d.getDate()+offset);
 curDate=d;
 buildDateTabs();
 loadFotMob();
}
function loadFotMob(){
 var main=document.getElementById('main');
 main.innerHTML='<div class="empty">Loading matches...<br>jeScores • Every Goal. Every Update.</div>';
 var dateStr=curDate.toISOString().split('T')[0];
 fetch(W+"/v3/fixtures?date="+dateStr).then(r=>r.json()).then(data=>{
  var fix=data.response||[];
  if(fix.length==0 && dateStr==new Date().toISOString().split('T')[0]){
   var y=new Date();y.setDate(y.getDate()-1);
   return fetch(W+"/v3/fixtures?date="+y.toISOString().split('T')[0]).then(r=>r.json()).then(d2=>d2.response||[]);
  }
  return fix;
 }).then(fix=>{
  games=fix;
  if(fix.length==0){main.innerHTML='<div class="empty">No matches on this date</div>';return;}
  renderFotMob();
 }).catch(e=>{main.innerHTML='<div class="empty">Error: '+e.message+'</div>';});
}
function renderFotMob(){
 var groups={};
 games.forEach(g=>{
  var key=g.league.id;
  if(!groups[key]) groups[key]={league:g.league,country:g.league.country||'',games:[]};
  groups[key].games.push(g);
 });
 var favTeams=JSON.parse(localStorage.getItem('jeScores_fav')||'[]');
 var followingGames=games.filter(g=>favTeams.indexOf(g.teams.home.name)>-1||favTeams.indexOf(g.teams.away.name)>-1);
 var html='';
 if(followingGames.length>0){
  html+='<div class="following-card"><div class="following-head"><b>⭐ Following</b><span>^</span></div>';
  followingGames.forEach(g=>{html+=matchRow(g);});
  html+='</div>';
 }
 Object.keys(groups).forEach(leagueId=>{
  var group=groups[leagueId];
  var isCollapsed=collapsed[leagueId];
  html+='<div class="league-card"><div class="league-head" onclick="toggleLeague('+leagueId+')"><b>🏳️ '+group.league.country+' - '+group.league.name+' ('+group.games.length+')</b><span class="arrow '+(isCollapsed?'':'open')+'">^</span></div>';
  if(!isCollapsed){
   group.games.forEach(g=>{html+=matchRow(g);});
  }
  html+='</div>';
 });
 document.getElementById('main').innerHTML=html||'<div class="empty">No matches</div>';
}
function matchRow(g){
 var live=g.fixture.status.short=='1H'||g.fixture.status.short=='2H'||g.fixture.status.short=='LIVE';
 var isNS=g.fixture.status.short=='NS';
 var timeStr=g.fixture.date.substr(11,5);
 var scoreText=isNS?timeStr:(g.goals.home!=null?g.goals.home:'-')+' - '+(g.goals.away!=null?g.goals.away:'-');
 var homeLogo='https://media.api-sports.io/football/teams/'+g.teams.home.id+'.png';
 var awayLogo='https://media.api-sports.io/football/teams/'+g.teams.away.id+'.png';
 return '<div class="match-row" onclick="openDetail('+g.fixture.id+')"><div class="team-left"><span>'+g.teams.home.name+'</span><div class="team-logo"><img src="'+homeLogo+'" onerror="this.style.display=\'none\'"></div></div><div class="center"><div class="'+(live||!isNS?'score':'')+'" style="'+(isNS?'font-size:12px;color:#fff':'')+'">'+scoreText+'</div><div class="status">'+(live?'LIVE • Every Goal.':g.fixture.status.short)+'</div></div><div class="team-right"><div class="team-logo"><img src="'+awayLogo+'" onerror="this.style.display=\'none\'"></div><span>'+g.teams.away.name+'</span></div></div>';
}
function toggleLeague(id){collapsed[id]=!collapsed[id];renderFotMob();}
function openDetail(id){
 curMatch=games.find(x=>x.fixture.id==id);
 if(!curMatch) return;
 document.getElementById('detailTitle').innerHTML=curMatch.teams.home.name+' vs '+curMatch.teams.away.name+' • <span>jeScores</span>';
 var homeLogo='https://media.api-sports.io/football/teams/'+curMatch.teams.home.id+'.png';
 var awayLogo='https://media.api-sports.io/football/teams/'+curMatch.teams.away.id+'.png';
 var score=(curMatch.goals.home!=null?curMatch.goals.home:'-')+' - '+(curMatch.goals.away!=null?curMatch.goals.away:'-');
 if(curMatch.fixture.status.short=='NS') score='vs';
 document.getElementById('scoreboard').innerHTML='<div class="teams"><div class="team-box"><img src="'+homeLogo+'" onerror="this.style.display=\'none\'"><div>'+curMatch.teams.home.name+'</div><button class="btn btnGold" style="margin-top:6px" onclick="followTeam(\''+curMatch.teams.home.name.replace(/'/g,"\\'")+'\')">⭐ Follow</button></div><div class="score-box">'+score+'<div style="font-size:10px;font-weight:400;color:#888;margin-top:4px">'+curMatch.fixture.status.long+'</div></div><div class="team-box"><img src="'+awayLogo+'" onerror="this.style.display=\'none\'"><div>'+curMatch.teams.away.name+'</div><button class="btn btnGold" style="margin-top:6px" onclick="followTeam(\''+curMatch.teams.away.name.replace(/'/g,"\\'")+'\')">⭐ Follow</button></div></div><div class="match-status">'+curMatch.league.name+' • '+curMatch.league.country+' • jeScores • Every Goal. Every Update.</div>';
 document.getElementById('detail').classList.add('show');
 setTab('lineup');
}
function closeDetail(){document.getElementById('detail').classList.remove('show');}
function setTab(t){
 curTab=t;
 document.querySelectorAll('.tb').forEach(el=>el.classList.remove('on'));
 document.getElementById('tb-'+t).classList.add('on');
 var content=document.getElementById('detailContent');
 if(t=='lineup'){
  content.innerHTML='<div class="empty">jeScores • Loading REAL lineups...</div>';
  fetch(W+"/v3/fixtures/lineups?fixture="+curMatch.fixture.id).then(r=>r.json()).then(data=>{
   var lineups=data.response||[];
   if(lineups.length==0){
    content.innerHTML='<div style="background:#0a2e1c;border:1px solid #e8b84b;border-radius:10px;padding:12px;color:#ccc"><b style="color:#e8b84b">No lineups yet • Every Goal. Every Update.</b><br><br>'+curMatch.teams.home.name+' vs '+curMatch.teams.away.name+'<br>Status: '+curMatch.fixture.status.long+'<br><br>Predicted XI 2 days before kickoff<br>Official XI 1h before kickoff<br><br><span style="font-size:10px;color:#888">Fixed: No fake Kenyan players for La Liga - uses real API data only</span></div>';
   } else {
    var html='<div class="lineup-grid">';
    lineups.forEach(l=>{
     html+='<div class="lineup-team"><b>'+l.team.name+' '+(l.formation||'')+'</b><div style="font-size:9px;color:#888;margin-bottom:6px">Coach: '+(l.coach?.name||'TBA')+'</div>';
     (l.startXI||[]).forEach(p=>{html+='<div class="player"><span>'+(p.player.number||'')+' '+p.player.name+'</span><span style="color:#888">'+(p.player.pos||'')+'</span></div>';});
     html+='<div style="margin-top:8px;font-size:9px;color:#666">Bench: '+(l.substitutes||[]).map(p=>p.player.name).join(', ')+'</div></div>';
    });
    html+='</div>';
    content.innerHTML=html;
   }
  }).catch(e=>{content.innerHTML='Error: '+e.message;});
 } else if(t=='stats'){
  content.innerHTML='<div class="empty">Loading stats... jeScores</div>';
  fetch(W+"/v3/fixtures/statistics?fixture="+curMatch.fixture.id).then(r=>r.json()).then(data=>{
   var stats=data.response||[];
   if(stats.length==0){content.innerHTML='<div class="empty">No stats yet - '+curMatch.fixture.status.long+'<br><br>When live: xG, Possession, Shots, Corners<br><br>jeScores • Every Goal. Every Update.</div>';return;}
   var html='<div style="background:#121212;border:1px solid #1e3d2a;border-radius:10px;padding:10px">';
   var types=[...new Set(stats.flatMap(s=>s.statistics.map(st=>st.type)))];
   types.forEach(type=>{
    var hv=stats[0]?.statistics.find(s=>s.type==type)?.value;
    var av=stats[1]?.statistics.find(s=>s.type==type)?.value;
    if(hv==null && av==null) return;
    var hN=parseInt(hv)||0,aN=parseInt(av)||0,total=hN+aN||1,pct=(hN/total)*100;
    html+='<div class="stat-row"><div class="stat-head"><span style="color:'+(hN>=aN?'#e8b84b':'#777')+'">'+hv+'</span><span style="color:#666">'+type+'</span><span style="color:'+(aN>=hN?'#e8b84b':'#777')+'">'+av+'</span></div><div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div><div class="bar-fill opp" style="width:'+(100-pct)+'%"></div></div></div>';
   });
   html+='</div>';
   content.innerHTML=html;
  }).catch(e=>{content.innerHTML='Error: '+e.message;});
 } else if(t=='events'){
  content.innerHTML='<div class="empty">Loading events... jeScores</div>';
  fetch(W+"/v3/fixtures/events?fixture="+curMatch.fixture.id).then(r=>r.json()).then(data=>{
   var events=data.response||[];
   if(events.length==0){content.innerHTML='<div class="empty">No events yet - '+curMatch.fixture.status.long+'<br><br>Goals, Cards, Subs appear here live<br><br>jeScores • Every Goal. Every Update.</div>';return;}
   var html='<div style="background:#121212;border:1px solid #1e3d2a;border-radius:10px;padding:10px">';
   events.forEach(ev=>{
    html+='<div class="event"><div class="event-time">'+(ev.time.elapsed||'')+'\''+(ev.time.extra?' +'+ev.time.extra:'')+'</div><div style="flex:1"><b>'+ev.team.name+'</b> - '+ev.player.name+'<br><span style="color:#888;font-size:10px">'+ev.type+' - '+ev.detail+'</span></div></div>';
   });
   html+='</div>';
   content.innerHTML=html;
  }).catch(e=>{content.innerHTML='Error: '+e.message;});
 } else if(t=='h2h'){
  content.innerHTML='<div class="empty">Loading H2H... jeScores</div>';
  fetch(W+"/v3/fixtures/headtohead?h2h="+curMatch.teams.home.id+"-"+curMatch.teams.away.id).then(r=>r.json()).then(data=>{
   var h2h=data.response||[];
   if(h2h.length==0){content.innerHTML='<div class="empty">No H2H data</div>';return;}
   var html='<div style="background:#121212;border:1px solid #1e3d2a;border-radius:10px;padding:10px">';
   h2h.slice(0,10).forEach(g=>{
    html+='<div class="match-row" style="padding:8px"><div class="team-left"><span style="font-size:11px">'+g.teams.home.name+'</span></div><div class="center"><div class="score" style="font-size:11px">'+g.goals.home+' - '+g.goals.away+'</div><div class="status" style="font-size:8px">'+g.fixture.date.substr(0,10)+'</div></div><div class="team-right"><span style="font-size:11px">'+g.teams.away.name+'</span></div></div>';
   });
   html+='</div>';
   content.innerHTML=html;
  }).catch(e=>{content.innerHTML='Error: '+e.message;});
 }
}
function followTeam(team){
 var fav=JSON.parse(localStorage.getItem('jeScores_fav')||'[]');
 if(fav.indexOf(team)==-1){fav.push(team);localStorage.setItem('jeScores_fav',JSON.stringify(fav));alert('⭐ Following '+team+' - appears in Following section on top');}
 else {fav=fav.filter(t=>t!=team);localStorage.setItem('jeScores_fav',JSON.stringify(fav));alert('Unfollowed '+team);}
}
function loadFollowingPage(){
 var fav=JSON.parse(localStorage.getItem('jeScores_fav')||'[]');
 if(fav.length==0){document.getElementById('main').innerHTML='<div class="empty">⭐ No Following yet<br>Tap any match to follow team<br><br>jeScores • Every Goal. Every Update.</div>';return;}
 var list=games.filter(g=>fav.indexOf(g.teams.home.name)>-1||fav.indexOf(g.teams.away.name)>-1);
 if(list.length==0){document.getElementById('main').innerHTML='<div class="empty">Following: '+fav.join(', ')+'<br><br>No live matches for your teams today</div>';return;}
 var html='<div class="following-card"><div class="following-head"><b>⭐ Following • '+fav.length+' teams</b></div>';
