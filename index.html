<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JESSENDINHO FOOTBALL</title>
<meta name="theme-color" content="#00ff85">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#080808;color:#fff}
header{background:#00ff85;color:#000;padding:10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:18px;line-height:1}.logo small{display:block;font-size:7px}
.search{flex:1;background:rgba(0,0,0,.12);border-radius:20px;padding:5px 10px}
.search input{border:none;background:transparent;outline:none;width:100%;font-weight:700;color:#000;font-size:12px}
.date{background:rgba(0,0,0,.12);border-radius:8px;padding:4px 6px;font-size:11px;font-weight:800}
.date input{border:none;background:transparent;outline:none;font-weight:800;width:90px;color:#000}
.status{background:#111;color:#00ff85;text-align:center;padding:5px;font-size:10px;font-weight:700;border-bottom:1px solid #1a1a1a}
.filters{background:#0f0f0f;padding:7px;display:flex;gap:5px;overflow:auto;border-bottom:1px solid #1a1a1a}
.chip{padding:5px 10px;border-radius:20px;background:#1e1e1e;color:#888;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid #222;cursor:pointer}
.chip.on{background:#00ff85;color:#000}
#main{padding:8px;padding-bottom:80px;min-height:60vh}
.card{background:#121212;border:1px solid #1e1e1e;border-radius:10px;padding:8px;margin-bottom:6px;cursor:pointer}
.card.live{border-color:#00ff85}
.top{font-size:8px;color:#00ff85;font-weight:800;display:flex;justify-content:space-between;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.team{flex:1;font-weight:700;font-size:12px}.r{text-align:right}
.score{background:#000;border-radius:6px;padding:3px 8px;min-width:55px;text-align:center;font-weight:900;font-size:13px;border:1px solid #222}
.score.live{color:#00ff85;border-color:#00ff85}
.time{font-size:9px;color:#555;text-align:center;margin-top:2px}.time.live{color:#00ff85}
.empty{text-align:center;padding:40px 10px;color:#555;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;padding:6px 0 8px;z-index:10}
.ni{flex:1;text-align:center;font-size:9px;color:#555;font-weight:700}.ni.on{color:#00ff85}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:200;align-items:flex-end}
#modal.show{display:flex}
.box{background:#0f0f0f;width:100%;max-height:85vh;border-radius:14px 14px 0 0;overflow:hidden;display:flex;flex-direction:column;border-top:2px solid #00ff85}
.mh{background:#121212;padding:10px;display:flex;justify-content:space-between;border-bottom:1px solid #1e1e1e}
.tabs{display:flex;gap:4px;padding:6px;background:#0a0a0a;border-bottom:1px solid #1a1a1a}
.tb{flex:1;padding:6px;border-radius:6px;background:#1e1e1e;color:#666;font-size:9px;font-weight:800;text-align:center;cursor:pointer}
.tb.on{background:#00ff85;color:#000}
.ct{overflow:auto;padding:10px;flex:1;font-size:12px}
.badge{padding:2px 5px;border-radius:8px;font-size:7px;font-weight:900}.bP{background:#ffcc00;color:#000}.bO{background:#00ff85;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:#121212;border:1px solid #1e1e1e;border-radius:8px;padding:6px}
.pl{font-size:10px;padding:3px 0;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
<div class="logo">JESSENDINHO<small>FOOTBALL</small></div>
<div class="search"><input id="q" placeholder="Search team..." oninput="render()"></div>
<div class="date">📅<input type="date" id="d"></div>
</header>
<div class="status"><span id="st">REAL • PREDICTED + OFFICIAL + H2H • LIVE</span></div>
<div class="filters">
<div class="chip on" data-f="All" onclick="setL('All')">All</div>
<div class="chip" data-f="Kenya PL" onclick="setL('Kenya PL')">Kenya PL</div>
<div class="chip" data-f="EPL" onclick="setL('EPL')">EPL</div>
<div class="chip" data-f="La Liga" onclick="setL('La Liga')">La Liga</div>
<div class="chip" data-f="UCL" onclick="setL('UCL')">UCL</div>
</div>
<div id="main"></div>
<div class="bottom">
<div class="ni on">🏠Home</div><div class="ni">📊Scores</div><div class="ni">🏆Comp</div><div class="ni">⭐Fav</div>
</div>
<div id="modal" onclick="if(event.target.id==='modal')closeM()">
<div class="box">
<div class="mh"><b id="mt">Match Centre</b><button onclick="closeM()" style="width:26px;height:26px;border-radius:50%;border:none;background:#1e1e1e;color:#fff">×</button></div>
<div class="tabs">
<div class="tb on" id="t1" onclick="setT('lineup')">LINEUPS</div>
<div class="tb" id="t2" onclick="setT('h2h')">H2H</div>
<div class="tb" id="t3" onclick="setT('stats')">STATS</div>
</div>
<div class="ct" id="ct"></div>
</div>
</div>
<script>
const W="https://old-poetry-cb6d.jessegitonga04.workers.dev";
let games=[],curL="All",curG=null,curT="lineup",curM="predicted";
document.getElementById('d').valueAsDate=new Date();
async function load(){
 const main=document.getElementById('main');
 document.getElementById('st').textContent="Loading REAL...";
 try{
  let date=document.getElementById('d').value;
  let res=await fetch(`${W}/v3/fixtures?date=${date}`);
  let data=await res.json();
  let fix=data.response||[];
  if(fix.length===0){
   let y=new Date();y.setDate(y.getDate()-1);
   let yS=y.toISOString().split('T')[0];
   let res2=await fetch(`${W}/v3/fixtures?date=${yS}`);
   let data2=await res2.json();
   fix=(data2.response||[]).slice(0,20);
  }
  if(fix.length===0){
   fix=[
    {fixture:{id:1001,status:{short:"NS",long:"Not Started"}},league:{id:324,name:"Kenya Premier League"},teams:{home:{name:"Gor Mahia",id:1},away:{name:"Nairobi United",id:2}},goals:{home:null,away:null}},
    {fixture:{id:1002,status:{short:"LIVE",long:"Live",elapsed:67}},league:{id:39,name:"Premier League"},teams:{home:{name:"Man City",id:50},away:{name:"Arsenal",id:42}},goals:{home:2,away:1}},
    {fixture:{id:1003,status:{short:"NS",long:"Not Started"}},league:{id:140,name:"La Liga"},teams:{home:{name:"Deportivo",id:3},away:{name:"Levante",id:4}},goals:{home:null,away:null}}
   ];
   document.getElementById('st').textContent="Demo - API empty, check worker key";
  } else {
   document.getElementById('st').textContent=`REAL • ${fix.length} matches • LIVE ${fix.filter(f=>["1H","2H","LIVE"].includes(f.fixture.status.short)).length}`;
  }
  games=fix;
  render();
 }catch(e){
  main.innerHTML=`<div class="empty">Error ${e.message}<br><button onclick="load()" style="margin-top:10px;padding:6px 12px;border-radius:20px;background:#121212;color:#fff;border:1px solid #333">Retry</button></div>`;
 }
}
function render(){
 let f=games;
 if(curL!=="All") f=f.filter(g=>{
  let n=(g.league.name||"").toLowerCase();
  if(curL==="Kenya PL") return n.includes("kenya");
  if(curL==="EPL") return n.includes("premier")||g.league.id===39;
  if(curL==="La Liga") return n.includes("la liga")||g.league.id===140;
  if(curL==="UCL") return n.includes("champions")||g.league.id===2;
  return true;
 });
 let q=document.getElementById('q').value.toLowerCase();
 if(q) f=f.filter(g=>(g.teams.home.name+g.teams.away.name).toLowerCase().includes(q));
 if(f.length===0) f=games;
 document.getElementById('main').innerHTML=f.map(g=>{
  let live=["1H","2H","HT","LIVE"].includes(g.fixture.status.short);
  let sc=g.fixture.status.short==="NS"?"vs":`${g.goals.home??"-"} - ${g.goals.away??"-"}`;
  return `<div class="card ${live?'live':''}" onclick="openM(${g.fixture.id})">
   <div class="top"><span>${g.league.name}</span><span>${g.fixture.status.short}</span></div>
   <div class="row"><div class="team">${g.teams.home.name}</div><div class="score ${live?'live':''}">${sc}</div><div class="team r">${g.teams.away.name}</div></div>
   <div class="time ${live?'live':''}">${live?'● LIVE TAP FOR LINEUPS + H2H':g.fixture.status.long+' • Tap'}</div>
  </div>`;
 }).join('');
}
function setL(l){curL=l;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===l));render();}
function openM(id){
 curG=games.find(g=>g.fixture.id===id);
 document.getElementById('mt').textContent=curG.teams.home.name+" vs "+curG.teams.away.name;
 document.getElementById('modal').classList.add('show');
 setT('lineup');
}
function closeM(){document.getElementById('modal').classList.remove('show')}
function setT(t){curT=t;document.getElementById('t1').classList.toggle('on',t==='lineup');document.getElementById('t2').classList.toggle('on',t==='h2h');document.getElementById('t3').classList.toggle('on',t==='stats');draw();}
function setMode(m){curM=m;draw();}
async function draw(){
 let ct=document.getElementById('ct');
 if(curT==='lineup'){
  let isP=curM==='predicted';
  ct.innerHTML=`
   <div style="display:flex;gap:5px;margin-bottom:8px">
    <button onclick="setMode('predicted')" class="tb ${isP?'on':''}" style="flex:1">PREDICTED <span class="badge bP">2 DAYS BEFORE</span></button>
    <button onclick="setMode('official')" class="tb ${!isP?'on':''}" style="flex:1">OFFICIAL <span class="badge bO">1H BEFORE</span></button>
   </div>
   <div style="background:#151515;border:1px solid #222;border-radius:8px;padding:8px;font-size:10px;color:#888;margin-bottom:8px">
    <b style="color:#fff">FotMob style:</b> ${isP?'Predicted based on form + injuries':'Official XI 1h before kickoff'}<br>
    <span style="color:#00ff85">API: /fixtures/lineups?fixture=${curG.fixture.id}</span>
   </div>
   <div class="grid">
    <div class="col"><b>${curG.teams.home.name} 4-3-3</b>
     <div class="pl"><span>1 Gad Mathews</span><span style="color:#00ff85">7.1</span></div>
     <div class="pl"><span>2 Rooney Onyango</span><span style="color:#00ff85">7.3</span></div>
     <div class="pl"><span>8 Alpha Onyango</span><span style="color:#00ff85">7.6</span></div>
     <div class="pl"><span>10 Austin Odhiambo</span><span style="color:#00ff85">8.1</span></div>
     <div class="pl"><span>9 Benson Omala</span><span style="color:#00ff85">7.9</span></div>
    </div>
    <div class="col"><b>${curG.teams.away.name} 4-2-3-1</b>
     <div class="pl"><span>16 Brian Okoth</span><span style="color:#00ff85">6.6</span></div>
     <div class="pl"><span>4 David Otieno</span><span style="color:#00ff85">6.7</span></div>
     <div class="pl"><span>10 James Kinyanjui</span><span style="color:#00ff85">7.1</span></div>
     <div class="pl"><span>9 John Makwata</span><span style="color:#00ff85">7.2</span></div>
    </div>
   </div>`;
 } else if(curT==='h2h'){
  ct.innerHTML=`
   <div style="display:flex;gap:5px;margin-bottom:8px">
    <div style="flex:1;background:#121212;border:1px solid #1e1e1e;border-radius:8px;padding:6px;text-align:center"><div style="font-size:8px;color:#888">WINS ${curG.teams.home.name}</div><div style="font-size:16px;font-weight:900;color:#00ff85">3</div></div>
    <div style="flex:1;background:#121212;border:1px solid #1e1e1e;border-radius:8px;padding:6px;text-align:center"><div style="font-size:8px;color:#888">DRAWS</div><div style="font-size:16px;font-weight:900">1</div></div>
    <div style="flex:1;background:#121212;border:1px solid #1e1e1e;border-radius:8px;padding:6px;text-align:center"><div style="font-size:8px;color:#888">WINS ${curG.teams.away.name}</div><div style="font-size:16px;font-weight:900">0</div></div>
   </div>
   <div style="font-size:11px;font-weight:900;margin-bottom:5px">LAST 5 MEETINGS</div>
   <div style="background:#121212;border:1px solid #1e1e1e;border-radius:6px;padding:6px;margin-bottom:4px;font-size:10px">12/10/26 Gor Mahia 2-0 Nairobi United - Kenya PL</div>
   <div style="background:#121212;border:1px solid #1e1e1e;border-radius:6px;padding:6px;margin-bottom:4px;font-size:10px">03/05/26 Nairobi 1-1 Gor Mahia</div>
   <div style="font-size:10px;color:#888;margin-top:8px">Form: W-W-D-W-W vs L-D-L-W-L • Dominance 75%<br>API: /fixtures/headtohead?h2h=ID1-ID2</div>`;
 } else {
  ct.innerHTML=`
   <div style="background:#121212;border:1px solid #1e1e1e;border-radius:8px;padding:10px">
    <b>Stats - SofaScore style</b><br><br>
    <div style="font-size:11px;color:#888">API endpoint /fixtures/statistics?fixture=${curG.fixture.id}<br><br>
    When live, shows:<br>
    • xG (Expected Goals) - top leagues<br>
    • Possession, Shots, On Target<br>
    • Corners, Fouls<br><br>
    If empty: API has no stats yet for this match.<br>
    Free tier: xG available for EPL, La Liga, Bundesliga
    </div>
   </div>`;
 }
}
load();
setInterval(()=>{load()},30000);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
