<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>jeScores - Every Goal. Every Update.</title>
<meta name="theme-color" content="#0a2e1c">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--green:#0a2e1c;--green2:#123d26;--gold:#e8b84b;--dark:#080808;--card:#111;--card2:#181818;--border:#1e3d2a;--text:#fff;--muted:#7a7a7a}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:var(--dark);color:var(--text)}
header{background:linear-gradient(135deg,var(--green),var(--green2));padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--gold)}
.logo{font-weight:900;font-size:20px;line-height:1;min-width:90px}.je{color:var(--gold)}.scores{color:#fff}
.logo small{display:block;font-size:6px;letter-spacing:1.8px;color:var(--gold);font-weight:800;margin-top:3px}.slogan{font-size:6px;color:var(--gold);opacity:.8;font-style:italic}
.search{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px}
.search input{border:none;background:transparent;outline:none;color:#fff;font-size:12px;width:100%}
.live-count{background:var(--gold);color:#000;border-radius:12px;padding:3px 8px;font-size:10px;font-weight:900;min-width:22px;text-align:center}
.date-tabs{background:#0e0e0e;display:flex;overflow:auto;padding:0 4px;border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:90}
.dt{padding:10px 12px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;cursor:pointer}
.dt.on{color:var(--text);border-bottom-color:var(--gold);background:rgba(232,184,75,.07)}
#main{padding:6px;padding-bottom:88px;min-height:80vh}
.league-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:200px}
.league-head{background:var(--card2);padding:9px 11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.league-head b{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.prio{font-size:7px;background:var(--gold);color:#000;padding:2px 5px;border-radius:4px;font-weight:900}
.match-row{display:flex;align-items:center;justify-content:space-between;padding:10px 10px;border-bottom:1px solid #151515;cursor:pointer}
.team{flex:1;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.team-left{justify-content:flex-end;text-align:right}.team-right{justify-content:flex-start}
.team-logo{width:22px;height:22px;background:#0a0a0a;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex-shrink:0;border:1px solid #1a1a1a}
.team-logo img{width:100%;height:100%;object-fit:contain}
.center{width:68px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.score{color:var(--gold);background:#000;border:1px solid var(--border);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:900;min-width:52px}
.time{color:#fff;font-size:11px;font-weight:700}
.status{font-size:8px;color:var(--muted);text-transform:uppercase}.status.live{color:var(--gold);font-weight:800}
.scorers{font-size:8.5px;color:#bbb;margin-top:3px;max-width:160px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.following-card{background:linear-gradient(135deg,var(--green),var(--green2));border:1px solid var(--gold);border-radius:12px;margin-bottom:10px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:200px}
.following-head{padding:9px 11px;display:flex;justify-content:space-between;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(232,184,75,.2)}
.following-head b{color:var(--gold);font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c0c0c;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:5px 0 6px;z-index:100}
.nav{flex:1;text-align:center;font-size:8.5px;color:var(--muted);font-weight:700;cursor:pointer;padding:3px}
.nav.on{color:var(--gold)}.nav span{font-size:17px;display:block;margin-bottom:1px}
.empty{text-align:center;padding:40px 12px;color:var(--muted);font-size:12px;line-height:1.6}.empty b{color:var(--gold)}
#detail{position:fixed;inset:0;background:var(--dark);z-index:200;display:none;flex-direction:column}
#detail.show{display:flex}
.d-head{background:linear-gradient(135deg,var(--green),var(--green2));padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold)}
.close{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:rgba(0,0,0,.3);color:var(--gold);font-size:18px;cursor:pointer;display:grid;place-items:center}
.scoreboard{background:var(--card);padding:14px 10px;text-align:center;border-bottom:1px solid var(--border)}
.teams{display:flex;justify-content:space-around;align-items:center;gap:6px}
.tbox{flex:1;text-align:center}.tbox img{width:44px;height:44px;object-fit:contain;background:#0a0a0a;border-radius:50%;padding:4px;border:1px solid #1a1a1a}
.tbox div{font-size:12px;font-weight:800;margin-top:5px}
.sbox{font-size:26px;font-weight:900;color:var(--gold);background:#000;border:1px solid var(--border);border-radius:10px;padding:5px 12px;min-width:72px}
.mstatus{font-size:9px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:4px;padding:7px;background:#0a0a0a;border-bottom:1px solid var(--border);overflow:auto}
.tb{flex:1;min-width:60px;padding:7px 6px;border-radius:8px;background:#1a1a1a;color:#777;font-size:9.5px;font-weight:800;text-align:center;cursor:pointer;border:1px solid #222;white-space:nowrap}
.tb.on{background:var(--gold);color:#000;border-color:var(--gold)}
.content{flex:1;overflow:auto;padding:10px;font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team-panel{background:#111;border:1px solid var(--border);border-radius:10px;padding:8px}
.team-panel b{color:var(--gold);font-size:10px;display:block;margin-bottom:5px}
.player{font-size:11px;padding:4px 0;border-bottom:1px solid #181818;display:flex;justify-content:space-between;gap:4px}
.stat-row{padding:7px 0;border-bottom:1px solid #151515}
.stat-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.bar{height:5px;background:#1a1a1a;border-radius:3px;display:flex;margin-top:4px;overflow:hidden}
.fill{height:100%;background:var(--gold)}.fill.opp{background:#333}
.event{padding:8px 0;border-bottom:1px solid #151515;display:flex;gap:8px;font-size:11px}
.e-time{font-weight:900;color:var(--gold);min-width:34px}
.btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:10px;font-weight:700;cursor:pointer}
.btnGold{background:var(--gold);color:#000;border-color:var(--gold)}
.news-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px}
.news-card img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#0a0a0a}
.news-title{font-size:12px;font-weight:700;line-height:1.3}.news-meta{font-size:9px;color:var(--muted);margin-top:4px}
.standings-table{width:100%;border-collapse:collapse;font-size:11px}
.standings-table th{color:var(--muted);font-size:9px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
.standings-table td{padding:6px 4px;border-bottom:1px solid #151515}
</style>
</head>
<body>
<header>
<div class="logo"><span class="je">je</span><span class="scores">Scores</span><small>BY JESSENDINHO</small><div class="slogan">Every Goal. Every Update.</div></div>
<div class="search">🔍 <input id="q" placeholder="Search team, league..." oninput="onSearch()"></div>
<div class="hdr-actions"><div class="live-count" id="liveCount">0 LIVE</div><div style="width:30px;height:30px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:12px;cursor:pointer" onclick="pickDate()">📅</div></div>
</header>
<div class="date-tabs" id="dateTabs"></div>
<div id="main"></div>
<div class="bottom">
<div class="nav on" id="nav-matches" onclick="setPage('matches')"><span>⚽</span>Matches</div>
<div class="nav" id="nav-news" onclick="setPage('news')"><span>📰</span>News</div>
<div class="nav" id="nav-leagues" onclick="setPage('leagues')"><span>🏆</span>Leagues</div>
<div class="nav" id="nav-following" onclick="setPage('following')"><span>⭐</span>Following</div>
<div class="nav" id="nav-more" onclick="setPage('more')"><span>☰</span>More</div>
</div>
<div id="detail">
<div class="d-head"><b id="dTitle">jeScores • Match</b><button class="close" onclick="closeDetail()">×</button></div>
<div class="scoreboard" id="scoreboard"></div>
<div class="tabs">
<div class="tb on" id="tb-overview" onclick="setTab('overview')">Overview</div>
<div class="tb" id="tb-lineup" onclick="setTab('lineup')">Lineup</div>
<div class="tb" id="tb-stats" onclick="setTab('stats')">Stats</div>
<div class="tb" id="tb-events" onclick="setTab('events')">Events</div>
<div class="tb" id="tb-h2h" onclick="setTab('h2h')">H2H</div>
</div>
<div class="content" id="dContent"></div>
</div>
<input type="date" id="datePicker" style="position:absolute;opacity:0;pointer-events:none">
<script>
var W="https://old-poetry-cb6d.jessegitonga04.workers.dev";
var TOP5={39:1,140:2,135:3,78:4,61:5};
var UEFA={2:6,3:7,848:8};
var games=[],curDate=new Date(),curPage='matches',collapsed={},curMatch=null,curTab='overview',pending={};
var memCache = {}, memTime = {};
function getCache(k){
  if (k in memCache) return memCache[k];
  try { var v = localStorage.getItem(k); if (!v) return null; var p = JSON.parse(v); memCache[k] = p.d; memTime[k] = p.t; return p.d; } catch(e){ return null; }
}
function setCache(k, d){
  memCache[k] = d; memTime[k] = Date.now();
  try { localStorage.setItem(k, JSON.stringify({t: Date.now(), d: d})); } catch(e){}
}
function cacheAge(k){
  if (k in memTime) return Date.now() - memTime[k];
  try { var v = localStorage.getItem(k); if (!v) return 999999; var p = JSON.parse(v); memCache[k] = p.d; memTime[k] = p.t; return Date.now() - p.t; } catch(e){ return 999999; }
}
function pruneCache(){
  try{
    var now = Date.now();
    for (var i = localStorage.length - 1; i >= 0; i--){
      var k = localStorage.key(i); if (!k) continue;
      var isEvents = k.indexOf('jeScores_events_') === 0;
      var isFixtures = k.indexOf('jeScores_fixtures_') === 0;
      if (!isEvents && !isFixtures) continue;
      try { var v = JSON.parse(localStorage.getItem(k)); var ttl = isFixtures ? 172800000 : 86400000; if (v && v.t && (now - v.t) > ttl) localStorage.removeItem(k); } catch(e){ localStorage.removeItem(k); }
    }
  } catch(e){}
}
var renderTimer;
function queueRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(function(){ if (curPage == 'matches') renderMatches(false); }, 250);
}
function fetchDedup(url){if(pending[url]) return pending[url];var p=fetch(url).then(r=>{if(!r.ok) throw new Error('HTTP '+r.status);return r.json()}).finally(()=>{delete pending[url]});pending[url]=p;return p;}
function buildDateTabs(){var el=document.getElementById('dateTabs');var html='';for(var i=-3;i<=7;i++){var d=new Date();d.setDate(d.getDate()+i);var label='';if(i==-1) label='Yesterday';else if(i==0) label='Today';else if(i==1) label='Tomorrow';else label=d.toLocaleDateString('en-GB',{weekday:'short'})+' '+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'});var on=d.toDateString()==curDate.toDateString();html+='<div class="dt '+(on?'on':'')+'" onclick="setDateOffset('+i+')">'+label+'</div>';}el.innerHTML=html;}
function setDateOffset(o){var d=new Date();d.setDate(d.getDate()+o);curDate=d;document.getElementById('datePicker').valueAsDate=d;buildDateTabs();loadMatches(true);}
function pickDate(){document.getElementById('datePicker').showPicker();}
document.getElementById('datePicker').addEventListener('change',function(){curDate=this.valueAsDate||new Date();buildDateTabs();loadMatches(true);});
function loadMatches(forceFresh){var dateStr=curDate.toISOString().split('T')[0];var cacheKey='jeScores_fixtures_'+dateStr;var cached=getCache(cacheKey);if(cached && !forceFresh){games=cached;renderMatches(true);if(cacheAge(cacheKey)>60000 || dateStr==new Date().toISOString().split('T')[0]){fetchFresh(dateStr,cacheKey);}return;}document.getElementById('main').innerHTML='<div class="empty"><b>jeScores</b><br>Loading matches...<br>Every Goal. Every Update.</div>';fetchFresh(dateStr,cacheKey);}
function fetchFresh(dateStr,cacheKey){var url=W+"/v3/fixtures?date="+dateStr;fetchDedup(url).then(data=>{var fix=data.response||[];games=fix;setCache(cacheKey,fix);renderMatches(false);fetchGoalScorers(fix);}).catch(e=>{var cached=getCache(cacheKey);if(cached){games=cached;renderMatches(true);}else document.getElementById('main').innerHTML='<div class="empty"><b>Error</b><br>'+e.message+'<br><button class="btn btnGold" onclick="loadMatches(true)">Retry</button></div>';});}
function fetchGoalScorers(fix){
  var liveStatus = ['1H','2H','HT','ET','BT','P','LIVE'];
  var top = fix.filter(function(g){
    var live = liveStatus.indexOf(g.fixture.status.short) > -1;
    return live || TOP5[g.league.id] || UEFA[g.league.id];
  }).slice(0, 15);
  top.forEach(function(g){
    var live = liveStatus.indexOf(g.fixture.status.short) > -1;
    var k = 'jeScores_events_' + g.fixture.id;
    var ttl = live ? 60000 : 86400000;
    if (cacheAge(k) < ttl) return;
    fetchDedup(W + "/v3/fixtures/events?fixture=" + g.fixture.id)
      .then(function(d){
        setCache(k, d.response || []);
        queueRender();
        if (curMatch && curMatch.fixture.id == g.fixture.id && curTab == 'events'){
          var cont = document.getElementById('dContent');
          if (cont) renderEvents(getCache(k) || [], cont);
        }
      })
      .catch(function(){});
  });
}
function renderMatches(fromCache){if(curPage!='matches') return;var q=document.getElementById('q').value.toLowerCase();var list=games;if(q) list=list.filter(g=>(g.teams.home.name+g.teams.away.name+g.league.name+g.league.country).toLowerCase().indexOf(q)>-1);var liveCount=list.filter(g=>['1H','2H','HT','ET','BT','P','LIVE'].indexOf(g.fixture.status.short)>-1).length;document.getElementById('liveCount').textContent=liveCount>0?liveCount+' LIVE':'0 LIVE';document.getElementById('liveCount').style.background=liveCount>0?'var(--gold)':'#222';document.getElementById('liveCount').style.color=liveCount>0?'#000':'#666';var groups={};list.forEach(g=>{var id=g.league.id;if(!groups[id]) groups[id]={league:g.league,games:[],prio:TOP5[id]||UEFA[id]||99};groups[id].games.push(g);});var sorted=Object.values(groups).sort((a,b)=>{if(a.prio!=b.prio) return a.prio-b.prio;return a.league.name.localeCompare(b.league.name);});var favTeams=JSON.parse(localStorage.getItem('jeScores_fav')||'[]');var followingGames=list.filter(g=>favTeams.indexOf(g.teams.home.name)>-1||favTeams.indexOf(g.teams.away.name)>-1);var html='';if(fromCache) html+='<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating • Every Goal. Every Update.</div>';if(followingGames.length>0 && !q){html+='<div class="following-card"><div class="following-head"><b>⭐ Following ('+followingGames.length+')</b></div>';followingGames.forEach(g=>{html+=matchRow(g);});html+='</div>';}sorted.forEach(group=>{var isCollapsed=collapsed[group.league.id];var prioLabel=group.prio<=5?'<span class="prio">TOP 5</span>':'';html+='<div class="league-card"><div class="league-head" onclick="toggleLeague('+group.league.id+')"><b>🏳️ '+group.league.country+' - '+group.league.name+' <span>('+group.games.length+')</span> '+prioLabel+'</b><span>⌃</span></div>';if(!isCollapsed){group.games.sort((a,b)=>{var liveA=['1H','2H','HT','LIVE'].indexOf(a.fixture.status.short)>-1;var liveB=['1H','2H','HT','LIVE'].indexOf(b.fixture.status.short)>-1;if(liveA!=liveB) return liveB-liveA;return new Date(a.fixture.date)-new Date(b.fixture.date);}).forEach(g=>{html+=matchRow(g);});}html+='</div>';});if(!html || (sorted.length==0 && followingGames.length==0)) html='<div class="empty"><b>No matches</b><br>'+curDate.toDateString()+'<br><br>Try another date</div>';document.getElementById('main').innerHTML=html;}
function matchRow(g){var s=g.fixture.status.short;var live=['1H','2H','ET','BT','P','LIVE'].indexOf(s)>-1;var ht=s=='HT',ns=s=='NS',pen=s=='PEN';var timeStr=new Date(g.fixture.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});var scoreText=ns?timeStr:(g.goals.home!=null?g.goals.home:'-')+' - '+(g.goals.away!=null?g.goals.away:'-');if(pen) scoreText+=' (PEN)';var statusText=ns?timeStr:live?(g.fixture.status.elapsed?g.fixture.status.elapsed+'\'':'LIVE'):ht?'HT':s;var homeLogo='https://media.api-sports.io/football/teams/'+g.teams.home.id+'.png';var awayLogo='https://media.api-sports.io/football/teams/'+g.teams.away.id+'.png';var events=getCache('jeScores_events_'+g.fixture.id);var scorerLine='';if(events){var goals=events.filter(ev=>ev.type=='Goal');if(goals.length>0){scorerLine=goals.slice(0,2).map(ev=>'<b>'+ev.player.name.split(' ').pop()+'</b> '+ev.time.elapsed+'\'').join(', ');if(goals.length>2) scorerLine+=' +'+(goals.length-2);}}return '<div class="match-row" onclick="openDetail('+g.fixture.id+')"><div class="team team-left"><span>'+g.teams.home.name+'</span><div class="team-logo"><img src="'+homeLogo+'" loading="lazy" onerror="this.style.display=\'none\'"></div></div><div class="center"><div class="'+(ns?'time':'score')+'">'+scoreText+'</div><div class="status '+(live?'live':'')+'">'+statusText+'</div>'+(scorerLine?'<div class="scorers">⚽ '+scorerLine+'</div>':'')+'</div><div class="team team-right"><div class="team-logo"><img src="'+awayLogo+'" loading="lazy" onerror="this.style.display=\'none\'"></div><span>'+g.teams.away.name+'</span></div></div>';}
function toggleLeague(id){collapsed[id]=!collapsed[id];renderMatches(true);}
var searchTimer;
function onSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ renderMatches(true); }, 150);
}
function openDetail(id){curMatch=games.find(x=>x.fixture.id==id);if(!curMatch) return;document.getElementById('dTitle').innerHTML=curMatch.teams.home.name+' vs '+curMatch.teams.away.name+' • <span style="color:var(--gold)">jeScores</span>';var homeLogo='https://media.api-sports.io/football/teams/'+curMatch.teams.home.id+'.png';var awayLogo='https://media.api-sports.io/football/teams/'+curMatch.teams.away.id+'.png';var score=(curMatch.goals.home!=null?curMatch.goals.home:'-')+' - '+(curMatch.goals.away!=null?curMatch.goals.away:'-');if(curMatch.fixture.status.short=='NS') score='vs';document.getElementById('scoreboard').innerHTML='<div class="teams"><div class="tbox"><img src="'+homeLogo+'" onerror="this.style.display=\'none\'"><div>'+curMatch.teams.home.name+'</div><button class="btn btnGold" style="margin-top:5px" onclick="followTeam(\''+curMatch.teams.home.name.replace(/'/g,"\\'")+'\')">⭐ Follow</button></div><div class="sbox">'+score+'<div style="font-size:9px;font-weight:400;color:#888;margin-top:3px">'+curMatch.fixture.status.long+(curMatch.fixture.status.elapsed?' • '+curMatch.fixture.status.elapsed+'\'':'')+'</div></div><div class="tbox"><img src="'+awayLogo+'" onerror="this.style.display=\'none\'"><div>'+curMatch.teams.away.name+'</div><button class="btn btnGold" style="margin-top:5px" onclick="followTeam(\''+curMatch.teams.away.name.replace(/'/g,"\\'")+'\')">⭐ Follow</button></div></div><div class="mstatus">'+curMatch.league.name+' • '+curMatch.league.country+' • '+(curMatch.fixture.venue?.name||'')+' • '+new Date(curMatch.fixture.date).toLocaleString()+' • Ref: '+(curMatch.fixture.referee||'TBA')+'</div>';document.getElementById('detail').classList.add('show');setTab('overview');}
function closeDetail(){document.getElementById('detail').classList.remove('show');}
function setTab(t){curTab=t;document.querySelectorAll('.tb').forEach(e=>e.classList.remove('on'));document.getElementById('tb-'+t).classList.add('on');var c=document.getElementById('dContent');if(t=='overview'){var events=getCache('jeScores_events_'+curMatch.fixture.id);var html='<div style="background:#111;border:1px solid var(--border);border-radius:10px;padding:10px"><b style="color:var(--gold)">Match Info</b><br><br>Competition: '+curMatch.league.name+' ('+curMatch.league.country+')<br>Venue: '+(curMatch.fixture.venue?.name||'TBA')+'<br>Kickoff: '+new Date(curMatch.fixture.date).toLocaleString()+'<br>Status: '+curMatch.fixture.status.long+(curMatch.fixture.status.elapsed?' - '+curMatch.fixture.status.elapsed+'\'':'')+'<br>Referee: '+(curMatch.fixture.referee||'TBA')+'<br><br>';if(events && events.length>0){var goals=events.filter(ev=>ev.type=='Goal');if(goals.length>0){html+='<b>⚽ Goal Scorers</b><br>';goals.forEach(ev=>{html+=ev.time.elapsed+'\' '+ev.team.name+' - '+ev.player.name+(ev.assist?.name?' (Assist: '+ev.assist.name+')':'')+' - '+ev.detail+'<br>';});html+='<br>';}}html+='<span style="font-size:10px;color:#666">Every Goal. Every Update.</span></div>';c.innerHTML=html;if(!events) fetchDedup(W+"/v3/fixtures/events?fixture="+curMatch.fixture.id).then(d=>{setCache('jeScores_events_'+curMatch.fixture.id,d.response||[]);if(curTab=='overview') setTab('overview');});}else if(t=='lineup'){c.innerHTML='<div class="empty">Loading lineups...</div>';var k='jeScores_lineups_'+curMatch.fixture.id;var cached=getCache(k);if(cached){renderLineup(cached,c); if(cacheAge(k)>60000) fetchLineup(k,c);}else fetchLineup(k,c);}else if(t=='stats'){c.innerHTML='<div class="empty">Loading stats...</div>';var k='jeScores_stats_'+curMatch.fixture.id;var cached=getCache(k);if(cached){renderStats(cached,c); if(cacheAge(k)>30000) fetchStats(k,c);}else fetchStats(k,c);}else if(t=='events'){var k='jeScores_events_'+curMatch.fixture.id;var cached=getCache(k);if(cached){renderEvents(cached,c);if(cacheAge(k)>60000) fetchEvents(k,c);}else{c.innerHTML='<div class="empty">Loading events...</div>';fetchEvents(k,c);}}else if(t=='h2h'){c.innerHTML='<div class="empty">Loading H2H...</div>';var k='jeScores_h2h_'+curMatch.teams.home.id+'-'+curMatch.teams.away.id;var cached=getCache(k);if(cached){renderH2H(cached,c);}fetchH2H(k,c);}}
function fetchLineup(k,c){fetchDedup(W+"/v3/fixtures/lineups?fixture="+curMatch.fixture.id).then(d=>{setCache(k,d.response||[]);renderLineup(d.response||[],c);}).catch(e=>{c.innerHTML='<div class="empty">Lineup not available<br>'+e.message+'</div>';});}
function renderLineup(lineups,c){if(lineups.length==0){c.innerHTML='<div style="background:#0a2e1c;border:1px solid #e8b84b;border-radius:10px;padding:12px"><b style="color:#e8b84b">Lineups not announced yet</b><br><br>'+curMatch.teams.home.name+' vs '+curMatch.teams.away.name+'<br>Status: '+curMatch.fixture.status.long+'<br><br>Predicted XI 2 days before • Official XI 1h before<br><br><span style="font-size:10px;color:#888">Real data only</span></div>';return;}var html='<div class="grid2">';lineups.forEach(l=>{html+='<div class="team-panel"><b>'+l.team.name+' '+(l.formation||'')+'</b><div style="font-size:9px;color:#888">Coach: '+(l.coach?.name||'TBA')+'</div>';(l.startXI||[]).forEach(p=>{html+='<div class="player"><span>'+(p.player.number||'')+' '+p.player.name+'</span><span style="color:#888">'+(p.player.pos||'')+'</span></div>';});html+='<div style="margin-top:6px;font-size:9px;color:#666">Bench: '+(l.substitutes||[]).map(p=>p.player.name).join(', ')+'</div></div>';});html+='</div>';c.innerHTML=html;}
function fetchStats(k,c){fetchDedup(W+"/v3/fixtures/statistics?fixture="+curMatch.fixture.id).then(d=>{setCache(k,d.response||[]);renderStats(d.response||[],c);}).catch(e=>{c.innerHTML='<div class="empty">Stats not available<br>'+curMatch.fixture.status.long+'</div>';});}
function renderStats(stats,c){if(stats.length==0){c.innerHTML='<div class="empty">No stats yet - '+curMatch.fixture.status.long+'</div>';return;}var html='<div style="background:#111;border:1px solid var(--border);border-radius:10px;padding:10px">';var types=[...new Set(stats.flatMap(s=>s.statistics.map(st=>st.type)))];types.forEach(type=>{var hv=stats[0]?.statistics.find(s=>s.type==type)?.value;var av=stats[1]?.statistics.find(s=>s.type==type)?.value;if(hv==null && av==null) return;if(hv==null) hv='0'; if(av==null) av='0';var hN=parseFloat(hv)||0,aN=parseFloat(av)||0,total=hN+aN||1,pct=(hN/total)*100;html+='<div class="stat-row"><div class="stat-head"><span style="color:'+(hN>=aN?'var(--gold)':'#777')+'">'+hv+'</span><span style="color:#666;font-size:10px">'+type+'</span><span style="color:'+(aN>=hN?'var(--gold)':'#777')+'">'+av+'</span></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div><div class="fill opp" style="width:'+(100-pct)+'%"></div></div></div>';});html+='</div>';c.innerHTML=html;}
function fetchEvents(k,c){fetchDedup(W+"/v3/fixtures/events?fixture="+curMatch.fixture.id).then(d=>{setCache(k,d.response||[]);renderEvents(d.response||[],c);}).catch(e=>{});}
function renderEvents(events,c){if(events.length==0){c.innerHTML='<div class="empty">No events yet - '+curMatch.fixture.status.long+'</div>';return;}var html='<div style="background:#111;border:1px solid var(--border);border-radius:10px;padding:8px">';events.forEach(ev=>{var icon=ev.type=='Goal'?'⚽':ev.type=='Card'?(ev.detail=='Yellow Card'?'🟨':'🟥'):ev.type=='subst'?'🔄':'•';var extra=ev.time.extra?' +'+ev.time.extra:'';html+='<div class="event"><div class="e-time">'+(ev.time.elapsed||'')+extra+'\'</div><div style="flex:1"><div><span style="margin-right:4px">'+icon+'</span><b>'+ev.team.name+'</b> - '+ev.player.name+(ev.assist?.name?' <span style="color:#888">(Assist: '+ev.assist.name+')</span>':'')+'</div><div style="font-size:10px;color:#888">'+ev.type+' - '+ev.detail+'</div></div></div>';});html+='</div>';c.innerHTML=html;}
function fetchH2H(k,c){fetchDedup(W+"/v3/fixtures/headtohead?h2h="+curMatch.teams.home.id+"-"+curMatch.teams.away.id+"&last=10").then(d=>{setCache(k,d.response||[]);renderH2H(d.response||[],c);}).catch(e=>{c.innerHTML='<div class="empty">H2H unavailable</div>';});}
function renderH2H(h2h,c){if(h2h.length==0){c.innerHTML='<div class="empty">No previous meetings</div>';return;}var html='<div style="background:#111;border:1px solid var(--border);border-radius:10px;padding:10px"><div style="font-size:11px;font-weight:800;color:var(--gold);margin-bottom:8px">Last '+h2h.length+' meetings</div>';h2h.slice(0,10).forEach(g=>{html+='<div class="match-row" style="padding:8px"><div class="team team-left" style="font-size:11px"><span>'+g.teams.home.name+'</span></div><div class="center"><div class="score" style="font-size:11px">'+g.goals.home+' - '+g.goals.away+'</div><div class="status" style="font-size:8px">'+g.league.name+' • '+g.fixture.date.substr(0,10)+'</div></div><div class="team team-right" style="font-size:11px"><span>'+g.teams.away.name+'</span></div></div>';});html+='</div>';c.innerHTML=html;}
function followTeam(team){var fav=JSON.parse(localStorage.getItem('jeScores_fav')||'[]');if(fav.indexOf(team)==-1){fav.push(team);localStorage.setItem('jeScores_fav',JSON.stringify(fav));alert('⭐ Following '+team);}else{fav=fav.filter(t=>t!=team);localStorage.setItem('jeScores_fav',JSON.stringify(fav));alert('Unfollowed '+team);}if(curPage=='matches') renderMatches(true);}
function setPage(p){curPage=p;document.querySelectorAll('.nav').forEach(n=>n.classList.remove('on'));document.getElementById('nav-'+p).classList.add('on');if(p=='matches'){pruneCache();buildDateTabs();loadMatches(false);}else if(p=='news'){loadNews();}else if(p=='leagues'){loadLeaguesHub();}else if(p=='following'){loadFollowingPage();}else if(p=='more'){loadMorePage();}}
function loadNews(){var main=document.getElementById('main');var cached=getCache('jeScores_news');if(cached){renderNews(cached,main,true); fetchNews(main);}else{main.innerHTML='<div class="empty"><b>jeScores News</b><br>Loading...</div>';fetchNews(main);}}
function fetchNews(main){var url='https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/sport/football/rss.xml';fetchDedup(url).then(d=>{var items=(d.items||[]).slice(0,20);setCache('jeScores_news',items);renderNews(items,main,false);}).catch(e=>{var cached=getCache('jeScores_news');if(cached) renderNews(cached,main,true);else main.innerHTML='<div class="empty"><b>News unavailable</b><br>Retry</div>';});}
function renderNews(items,main,fromCache){var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached</div>':'');html+='<div style="padding:5px 0"><b style="color:var(--gold)">⚽ Football News</b><div style="font-size:9px;color:#888">From BBC Sport • Attributable</div></div>';items.forEach(it=>{html+='<div class="news-card" onclick="window.open(\''+it.link.replace(/'/g,"\\'")+'\',\'_blank\')"><img src="'+(it.enclosure?.link||'https://media.api-sports.io/football/leagues/39.png')+'"><div><div class="news-title">'+it.title+'</div><div class="news-meta">'+(it.pubDate||'')+' • BBC</div></div></div>';});document.getElementById('main').innerHTML=html;}
var curLeague=null;var curLeagueTab='standings';var curLeagueSeason=0;
function loadLeaguesHub(){
 var main=document.getElementById('main');
 main.innerHTML='<div class="empty"><b>🏆 Leagues • jeScores</b><br>Loading competitions...<br><span style="font-size:10px">Every Goal. Every Update.</span></div>';
 var cached=getCache('jeScores_leagues');
 if(cached){renderLeagues(cached,main); return;}
 fetchDedup(W+"/v3/leagues?current=true").then(d=>{
  var leagues=d.response||[];
  // filter only type league/cup and current
  setCache('jeScores_leagues',leagues);
  renderLeagues(leagues,main);
 }).catch(e=>{

  if(c) renderLeagues(c,main);
  else main.innerHTML='<div class="empty"><b>Error loading leagues</b><br>'+e.message+'<br><button class="btn btnGold" onclick="loadLeaguesHub()">Retry</button></div>';
 });

function renderLeagues(leagues,main){
 // Build priority list
 var sorted=leagues.slice().sort((a,b)=>{
  var pa=TOP5[a.league.id]||UEFA[a.league.id]||99;
  var pb=TOP5[b.league.id]||UEFA[b.league.id]||99;
  if(pa!=pb) return pa-pb;
  return a.league.name.localeCompare(b.league.name);
 });
 // Keep top + important others
 var top6=[39,140,135,78,61,2]; // EPL LaLiga SerieA Bundesliga Ligue1 UCL
 var topLeagues=sorted.filter(l=>top6.indexOf(l.league.id)>-1);
 var otherLeagues=sorted.filter(l=>top6.indexOf(l.league.id)==-1);
 var html='<div style="padding:6px 0"><b style="color:var(--gold)">🏆 Leagues • jeScores</b><div style="font-size:9px;color:#888">Top 5 + UCL prioritized • Real API data • Tap to open</div></div>';
 html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">★ Top Competitions</b></div>';
 topLeagues.forEach(l=>{
  var prio=TOP5[l.league.id]?'<span class="prio">TOP 5</span>':(l.league.id==2?'<span class="prio" style="background:#1e3d8f;color:#fff">UCL</span>':'');
  var logo='https://media.api-sports.io/football/leagues/'+l.league.id+'.png';
  html+='<div class="league-card"><div class="league-head" onclick="openLeague('+l.league.id+',\''+l.league.name.replace(/'/g,"\\'")+'\',\''+(l.country.name||'World').replace(/'/g,"\\'")+'\','+(JSON.stringify(l.seasons||[]).replace(/'/g,"\\'")+')"><div style="display:flex;align-items:center;gap:8px"><img src="'+logo+'" style="width:22px;height:22px;object-fit:contain" onerror="this.style.display=\'none\'"><b>🏳️ '+(l.country.name||'World')+' - '+l.league.name+' '+prio+'</b></div><span style="color:var(--gold)">→</span></div></div>';
 });
 html+='<div style="padding:8px 0 4px"><b style="font-size:11px;color:#aaa">Other Leagues & Cups</b> <span style="font-size:9px;color:#666">('+otherLeagues.length+')</span></div>';
 otherLeagues.slice(0,100).forEach(l=>{
  var logo='https://media.api-sports.io/football/leagues/'+l.league.id+'.png';
  html+='<div class="league-card"><div class="league-head" onclick="openLeague('+l.league.id+',\''+l.league.name.replace(/'/g,"\\'")+'\',\''+(l.country.name||'World').replace(/'/g,"\\'")+'\','+(JSON.stringify(l.seasons||[]).replace(/'/g,"\\'")+')"><div style="display:flex;align-items:center;gap:8px"><img src="'+logo+'" style="width:20px;height:20px;object-fit:contain" onerror="this.style.display=\'none\'"><b style="font-size:11px">🏳️ '+(l.country.name||'World')+' - '+l.league.name+'</b></div><span style="color:var(--muted);font-size:10px">→</span></div></div>';
 });
 document.getElementById('main').innerHTML=html;
}
function openLeague(id,name,country,seasons){
 curLeague={id:id,name:name,country:country,seasons:seasons||[]};
 // determine season
 var defaultSeason=new Date().getFullYear(); if(new Date().getMonth()<7) defaultSeason--;
 if(seasons && seasons.length>0){
  // pick most recent season that is covered and current or last
  var sortedSeasons=seasons.slice().sort((a,b)=>b.year-a.year);
  defaultSeason=sortedSeasons[0].year;
  // if current year season not in list, pick latest
  if(!seasons.find(s=>s.year==defaultSeason)) defaultSeason=sortedSeasons[0].year;
 }
 curLeagueSeason=defaultSeason;
 curLeagueTab='standings';
 renderLeagueScreen();
}
function renderLeagueScreen(){
 if(!curLeague) return;
 var main=document.getElementById('main');
 var seasons=curLeague.seasons||[];
 var seasonOptions='';
 if(seasons.length>0){
  seasons.slice().sort((a,b)=>b.year-a.year).slice(0,8).forEach(s=>{
   seasonOptions+='<option value="'+s.year+'" '+(s.year==curLeagueSeason?'selected':'')+'>'+s.year+'/'+(s.year+1)+'</option>';
  });
 } else {
  var y=new Date().getFullYear(); for(var i=0;i<5;i++){var yr=y-i; seasonOptions+='<option value="'+yr+'" '+(yr==curLeagueSeason?'selected':'')+'>'+yr+'/'+(yr+1)+'</option>';}
 }
 var logo='https://media.api-sports.io/football/leagues/'+curLeague.id+'.png';
 var html='<div class="league-card"><div class="league-head" style="flex-direction:column;align-items:stretch;gap:6px">';
 html+='<div style="display:flex;justify-content:space-between;align-items:center;width:100%"><div style="display:flex;align-items:center;gap:8px"><img src="'+logo+'" style="width:26px;height:26px" onerror="this.style.display=\'none\'"><b>🏆 '+curLeague.name+' • '+curLeague.country+'</b></div><span onclick="loadLeaguesHub()" style="color:var(--gold);cursor:pointer;background:#000;border:1px solid var(--border);border-radius:12px;padding:3px 8px;font-size:10px">← Back</span></div>';
 html+='<div style="display:flex;gap:8px;align-items:center"><span style="font-size:10px;color:#888">Season:</span><select id="seasonSel" onchange="changeSeason(this.value)" style="background:#000;color:#fff;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11px">'+seasonOptions+'</select><span style="font-size:8px;color:#555">API: '+curLeagueSeason+'</span></div>';
 html+='</div></div>';
 html+='<div style="display:flex;gap:4px;padding:6px 0;overflow:auto;position:sticky;top:61px;background:var(--dark);z-index:5">';
 var tabs=[['standings','Standings'],['fixtures','Fixtures'],['results','Results'],['scorers','Top Scorers'],['assists','Assists']];
 tabs.forEach(t=>{
  html+='<div class="tb '+(curLeagueTab==t[0]?'on':'')+'" onclick="switchLeagueTab(\''+t[0]+'\')" style="min-width:70px">'+t[1]+'</div>';
 });
 html+='</div>';
 html+='<div id="leagueContent"><div class="empty">Loading '+curLeagueTab+'...</div></div>';
 main.innerHTML=html;
 loadLeagueTabData();
}
function changeSeason(y){curLeagueSeason=parseInt(y); renderLeagueScreen();}
function switchLeagueTab(tab){curLeagueTab=tab; renderLeagueScreen();}
function loadLeagueTabData(){
 var container=document.getElementById('leagueContent');
 if(!container) return;
 if(curLeagueTab=='standings') loadLeagueStandings(container);
 else if(curLeagueTab=='fixtures') loadLeagueFixtures(container,false);
 else if(curLeagueTab=='results') loadLeagueFixtures(container,true);
 else if(curLeagueTab=='scorers') loadLeagueTopScorers(container,false);
 else if(curLeagueTab=='assists') loadLeagueTopScorers(container,true);
}
function loadLeagueStandings(container){
 var k='jeScores_standings_'+curLeague.id+'_'+curLeagueSeason;
 var cached=getCache(k);
 if(cached){renderLeagueStandings(cached,container,true); if(cacheAge(k)>60000) fetchLeagueStandings(k,container);}
 else {container.innerHTML='<div class="empty">Loading standings...<br><span style="font-size:10px">Real data from API-Football</span></div>'; fetchLeagueStandings(k,container);}
}
function fetchLeagueStandings(k,container){
 fetchDedup(W+"/v3/standings?league="+curLeague.id+"&season="+curLeagueSeason).then(d=>{
  setCache(k,d.response||[]);
  renderLeagueStandings(d.response||[],container,false);
 }).catch(e=>{
  var c=getCache(k);
  if(c) renderLeagueStandings(c,container,true);
  else container.innerHTML='<div class="empty"><b>No standings available</b><br>This competition may not have a league table (cup format) or data not yet available for '+curLeagueSeason+'<br><br>Error: '+e.message+'<br><button class="btn btnGold" onclick="loadLeagueTabData()">Retry</button></div>';
 });
}
function renderLeagueStandings(data,container,fromCache){
 var standings=(data||[])[0]?.league?.standings;
 var table=null;
 if(standings && standings.length>0){
  // Some leagues have multiple groups, pick first or combine? Show first group by default, but show all groups if >1
  table=standings[0];
  // If multiple groups (like UCL groups), show all
  if(standings.length>1){
   var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating</div>':'');
   html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">Standings • '+curLeague.name+' • '+curLeagueSeason+'/'+(curLeagueSeason+1)+'</b> <span style="font-size:9px;color:#666">'+(fromCache?'cached':'live')+'</span></div>';
   standings.forEach((group,gi)=>{
    html+='<div class="league-card" style="padding:8px;margin-bottom:10px"><b style="color:var(--gold);font-size:10px">Group '+(group[0]?.group||String.fromCharCode(65+gi))+'</b><div style="overflow:auto"><table class="standings-table"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>';
    group.forEach(s=>{
     var formHtml=(s.form||'').split('').slice(-5).map(f=>{var c=f=='W'?'#2ecc71':f=='D'?'#888':f=='L'?'#ff3b30':'#555';return '<span style="background:'+c+';color:#000;border-radius:3px;padding:1px 3px;font-size:8px;margin:1px">'+f+'</span>';}).join('');
     html+='<tr><td>'+s.rank+'</td><td><div style="display:flex;align-items:center;gap:5px"><img src="https://media.api-sports.io/football/teams/'+s.team.id+'.png" style="width:16px;height:16px" onerror="this.style.display=\'none\'"><span style="font-weight:700">'+s.team.name+'</span></div></td><td>'+s.all.played+'</td><td>'+s.all.win+'</td><td>'+s.all.draw+'</td><td>'+s.all.lose+'</td><td>'+s.all.goals.for+'</td><td>'+s.all.goals.against+'</td><td>'+s.goalsDiff+'</td><td style="font-weight:900;color:var(--gold)">'+s.points+'</td><td>'+formHtml+'</td></tr>';
    });
    html+='</table></div></div>';
   });
   container.innerHTML=html;
   return;
  }
 }
 if(!table || table.length==0){
  // Check if data is empty but we have standings in other format?
  container.innerHTML='<div class="empty"><b>No standings for this season</b><br>'+curLeague.name+' • '+curLeagueSeason+'<br><br>This may be a cup competition or season not started yet.<br>Try another season or check Fixtures tab.</div>';
  return;
 }
 var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating</div>':'');
 html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">Standings • '+curLeague.name+' • '+curLeagueSeason+'/'+(curLeagueSeason+1)+'</b> <span style="font-size:9px;color:#666">'+(fromCache?'cached':'live')+'</span></div>';
 html+='<div class="league-card" style="padding:0;overflow:hidden"><div style="overflow:auto"><table class="standings-table" style="min-width:500px"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>';
 table.forEach(s=>{
  var desc=''; var descColor='#555';
  if(s.description){ if(s.description.toLowerCase().indexOf('champions')>-1) descColor='#2ecc71'; else if(s.description.toLowerCase().indexOf('europa')>-1) descColor='#f39c12'; else if(s.description.toLowerCase().indexOf('relegation')>-1) descColor='#ff3b30'; desc='<div style="font-size:7px;color:'+descColor+'">'+s.description+'</div>'; }
  var formHtml=(s.form||'').split('').slice(-5).map(f=>{var c=f=='W'?'#2ecc71':f=='D'?'#888':f=='L'?'#ff3b30':'#555';return '<span style="background:'+c+';color:#000;border-radius:3px;padding:1px 3px;font-size:8px;margin:1px;display:inline-block;min-width:10px;text-align:center">'+f+'</span>';}).join('');
  html+='<tr><td>'+s.rank+'</td><td><div style="display:flex;align-items:center;gap:5px"><img src="https://media.api-sports.io/football/teams/'+s.team.id+'.png" style="width:16px;height:16px;object-fit:contain" onerror="this.style.display=\'none\'"><div><span style="font-weight:700">'+s.team.name+'</span>'+desc+'</div></div></td><td>'+s.all.played+'</td><td>'+s.all.win+'</td><td>'+s.all.draw+'</td><td>'+s.all.lose+'</td><td>'+s.all.goals.for+'</td><td>'+s.all.goals.against+'</td><td>'+(s.goalsDiff>0?'+'+s.goalsDiff:s.goalsDiff)+'</td><td style="font-weight:900;color:var(--gold)">'+s.points+'</td><td><div style="display:flex;gap:1px">'+formHtml+'</div></td></tr>';
 });
 html+='</table></div></div><div style="font-size:8px;color:#666;padding:6px">Swipe table horizontally • GF=Goals For GA=Against GD=Difference • Colors: Green=UCL qualification, Orange=Europa, Red=Relegation (when provider supplies description)</div>';
 container.innerHTML=html;
}
function loadLeagueFixtures(container,isResults){
 var type=isResults?'results':'fixtures';
 var k='jeScores_league_'+type+'_'+curLeague.id+'_'+curLeagueSeason;
 var cached=getCache(k);
 if(cached){renderLeagueFixtures(cached,container,isResults,true); if(cacheAge(k)>120000) fetchLeagueFixtures(k,container,isResults);}
 else {container.innerHTML='<div class="empty">Loading '+type+'...<br>Real fixtures from API</div>'; fetchLeagueFixtures(k,container,isResults);}
}
function fetchLeagueFixtures(k,container,isResults){
 fetchDedup(W+"/v3/fixtures?league="+curLeague.id+"&season="+curLeagueSeason).then(d=>{
  setCache(k,d.response||[]);
  renderLeagueFixtures(d.response||[],container,isResults,false);
 }).catch(e=>{
  var c=getCache(k);
  if(c) renderLeagueFixtures(c,container,isResults,true);
  else container.innerHTML='<div class="empty"><b>Error loading fixtures</b><br>'+e.message+'<br><button class="btn btnGold" onclick="loadLeagueTabData()">Retry</button></div>';
 });
}
function renderLeagueFixtures(fixtures,container,isResults,fromCache){
 var list=fixtures;
 if(isResults) list=list.filter(g=>['FT','AET','PEN','AWD','WO'].indexOf(g.fixture.status.short)>-1);
 else list=list.filter(g=>['NS','TBD','1H','2H','HT','LIVE','ET','BT','P','SUSP','INT'].indexOf(g.fixture.status.short)>-1);
 // sort
 list.sort((a,b)=> isResults? new Date(b.fixture.date)-new Date(a.fixture.date) : new Date(a.fixture.date)-new Date(b.fixture.date));
 if(list.length==0){
  container.innerHTML='<div class="empty"><b>No '+(isResults?'results':'upcoming fixtures')+' for '+curLeagueSeason+'</b><br>Try other tab or season</div>';
  return;
 }
 var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating</div>':'');
 html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">'+(isResults?'Results':'Upcoming Fixtures')+' • '+curLeague.name+' • '+curLeagueSeason+'</b> <span style="font-size:9px;color:#666">'+list.length+' matches</span></div>';
 // group by date
 var byDate={};
 list.forEach(g=>{var d=new Date(g.fixture.date).toDateString(); if(!byDate[d]) byDate[d]=[]; byDate[d].push(g);});
 Object.keys(byDate).forEach(dateStr=>{
  html+='<div class="league-card"><div class="league-head" style="background:#0a0a0a"><b style="font-size:10px;color:#aaa">'+dateStr+'</b><span style="font-size:9px;color:#666">'+byDate[dateStr].length+' matches</span></div>';
  byDate[dateStr].forEach(g=>{
   // inject into global games for match centre
   if(!games.find(x=>x.fixture.id==g.fixture.id)) games.push(g);
   html+=matchRow(g);
  });
  html+='</div>';
 });
 container.innerHTML=html;
}
function loadLeagueTopScorers(container,isAssists){
 var type=isAssists?'topassists':'topscorers';
 var k='jeScores_league_'+type+'_'+curLeague.id+'_'+curLeagueSeason;
 var cached=getCache(k);
 if(cached){renderLeagueTop(cached,container,isAssists,true); if(cacheAge(k)>3600000) fetchLeagueTop(k,container,isAssists);}
 else {container.innerHTML='<div class="empty">Loading '+(isAssists?'assists':'top scorers')+'...</div>'; fetchLeagueTop(k,container,isAssists);}
}
function fetchLeagueTop(k,container,isAssists){
 var endpoint=isAssists?'players/topassists':'players/topscorers';
 fetchDedup(W+"/v3/"+endpoint+"?league="+curLeague.id+"&season="+curLeagueSeason).then(d=>{
  setCache(k,d.response||[]);
  renderLeagueTop(d.response||[],container,isAssists,false);
 }).catch(e=>{
  var c=getCache(k);
  if(c) renderLeagueTop(c,container,isAssists,true);
  else container.innerHTML='<div class="empty"><b>No '+(isAssists?'assist':'scorer')+' data</b><br>Provider may not support for this league/season<br>'+e.message+'</div>';
 });
}
function renderLeagueTop(data,container,isAssists,fromCache){
 if(!data || data.length==0){container.innerHTML='<div class="empty"><b>No '+(isAssists?'assist':'scorer')+' data available</b><br>'+curLeague.name+' • '+curLeagueSeason+'<br>Try another season</div>'; return;}
 var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached</div>':'');
 html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">'+(isAssists?'Top Assists':'Top Scorers')+' • '+curLeague.name+' • '+curLeagueSeason+'</b></div>';
 html+='<div class="league-card" style="padding:0"><table class="standings-table"><tr><th>#</th><th>Player</th><th>Team</th><th>'+(isAssists?'A':'G')+'</th><th>'+(isAssists?'G+A':'A')+'</th></tr>';
 data.slice(0,20).forEach((p,i)=>{
  var stat=p.statistics[0];
  var goals=stat.goals.total||0;
  var assists=stat.goals.assists||0;
  var mainVal=isAssists?assists:goals;
  var secondVal=isAssists?goals:assists;
  html+='<tr><td>'+(i+1)+'</td><td><div style="display:flex;align-items:center;gap:6px"><img src="'+(p.player.photo||'https://media.api-sports.io/football/teams/'+stat.team.id+'.png')+'" style="width:20px;height:20px;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\'"><span style="font-weight:700">'+p.player.name+'</span></div><div style="font-size:8px;color:#888">'+(p.player.nationality||'')+' • '+(p.player.age||'')+'y</div></td><td><div style="display:flex;align-items:center;gap:4px"><img src="https://media.api-sports.io/football/teams/'+stat.team.id+'.png" style="width:14px;height:14px" onerror="this.style.display=\'none\'"><span style="font-size:10px">'+stat.team.name+'</span></div></td><td style="font-weight:900;color:var(--gold)">'+mainVal+'</td><td style="color:#aaa">'+secondVal+'</td></tr>';
 });
 html+='</table></div><div style="font-size:8px;color:#666;padding:6px">G=Goals A=Assists • Real data from API-Football • Tap player row for profile (coming soon)</div>';
 container.innerHTML=html;
}

function loadFollowingPage(){var main=document.getElementById('main');var favTeams=JSON.parse(localStorage.getItem('jeScores_fav')||'[]');if(favTeams.length==0){main.innerHTML='<div class="empty"><b>⭐ Following</b><br>No teams followed<br><br><button class="btn btnGold" onclick="setPage(\'matches\')">Browse Matches</button></div>';return;}var html='<div style="padding:5px 0"><b style="color:var(--gold)">⭐ Following • '+favTeams.length+' teams</b></div>';html+='<div class="league-card" style="padding:10px"><div style="font-size:11px">'+favTeams.map(t=>'<span style="background:#1a1a1a;border:1px solid var(--border);border-radius:12px;padding:3px 8px;margin:2px;display:inline-block">'+t+' <span style="color:var(--gold);cursor:pointer" onclick="followTeam(\''+t.replace(/'/g,"\\'")+'\')">×</span></span>').join('')+'</div></div>';var filtered=games.filter(g=>favTeams.indexOf(g.teams.home.name)>-1||favTeams.indexOf(g.teams.away.name)>-1);if(filtered.length>0){html+='<div class="league-card"><div class="league-head"><b>Matches for Following</b></div>';filtered.forEach(g=>{html+=matchRow(g);});html+='</div>';}html+='<div style="text-align:center;margin-top:10px"><button class="btn" onclick="clearFollowing()">Clear All</button></div>';main.innerHTML=html;}

function loadTopScorersHub(){var main=document.getElementById('main');main.innerHTML='<div class="empty"><b>Top Scorers</b><br>Loading...</div>';var ids=[39,140,135,78,61];var season=new Date().getFullYear(); if(new Date().getMonth()<7) season--;var promises=ids.map(id=>fetchDedup(W+"/v3/players/topscorers?league="+id+"&season="+season).then(d=>{return {id:id,data:d.response||[]};}).catch(()=>{return {id:id,data:[]};}));Promise.all(promises).then(results=>{var html='<div class="league-card"><div class="league-head"><b>⚽ Top Scorers • Top 5 • '+season+'/'+(season+1)+'</b><span onclick="loadMorePage()" style="color:var(--gold);cursor:pointer">← Back</span></div></div>';results.forEach(r=>{var names={39:'EPL',140:'La Liga',135:'Serie A',78:'Bundesliga',61:'Ligue 1'};if(r.data.length==0) return;html+='<div class="league-card" style="padding:10px"><b style="color:var(--gold)">'+names[r.id]+'</b><table class="standings-table"><tr><th>Player</th><th>Team</th><th>G</th></tr>';r.data.slice(0,5).forEach(p=>{html+='<tr><td style="font-weight:700">'+p.player.name+'</td><td>'+p.statistics[0].team.name+'</td><td style="color:var(--gold);font-weight:900">'+p.statistics[0].goals.total+'</td></tr>';});html+='</table></div>';});main.innerHTML=html;});}
