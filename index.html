<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;

  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GoalLine LIVE - By Jessendinho</title>
<meta name="theme-color" content="#00ff85">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#080808;color:#fff;overflow-x:hidden}
header{background:#00ff85;color:#080808;padding:12px 12px 8px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px;line-height:1} .logo small{display:block;font-size:9px;letter-spacing:3px;font-weight:700;opacity:0.8}
.searchBox{flex:1;min-width:120px;background:rgba(0,0,0,0.15);border:2px solid rgba(0,0,0,0.2);border-radius:20px;padding:8px 14px}
.searchBox input{background:transparent;border:none;outline:none;color:#080808;width:100%;font-weight:600}
.dateBox{background:rgba(0,0,0,0.15);border:2px solid rgba(0,0,0,0.2);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;display:flex;gap:6px}
.dateBox input{background:transparent;border:none;outline:none;font-weight:800;width:110px;color:#080808}
.iconBtn{background:rgba(0,0,0,0.15);border:2px solid rgba(0,0,0,0.2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;cursor:pointer}
.statusBar{background:#00ff85;color:#080808;text-align:center;padding:6px;font-size:12px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#080808;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
.filters{background:#0f0f0f;padding:10px 12px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid #1a1a1a;position:sticky;top:62px;z-index:90}
.filters::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:20px;background:#1e1e1e;color:#aaa;font-size:13px;font-weight:700;border:1px solid #2a2a2a;cursor:pointer;flex-shrink:0}
.chip.active{background:#00ff85;color:#080808;border-color:#00ff85}
main{padding:12px;min-height:70vh;padding-bottom:80px}
.card{background:#121212;border:1px solid #1e1e1e;border-radius:14px;padding:12px;margin-bottom:10px}
.card.live{border-color:#00ff8540;box-shadow:0 0 0 1px #00ff8530}
.card.flash{animation:goalFlash 1s}
@keyframes goalFlash{0%{background:#121212}50%{background:#00ff8520}100%{background:#121212}}
.league{font-size:10px;color:#00ff85;font-weight:800;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between}
.matchRow{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.team{flex:1;font-weight:600;font-size:14px}
.team.right{text-align:right}
.scoreBox{background:#000;border-radius:8px;padding:6px 12px;min-width:70px;text-align:center;font-weight:900;font-size:16px;border:1px solid #222}
.scoreBox.live{color:#00ff85;border-color:#00ff85}
.time{font-size:11px;color:#888;font-weight:700;text-align:center;margin-top:4px}
.time.live{color:#00ff85}
.empty{text-align:center;padding:60px 20px;color:#555}
.skeleton{background:linear-gradient(90deg,#121212 25%,#1a1a1a 50%,#121212 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:14px;height:90px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:100}
.navItem{flex:1;text-align:center;font-size:12px;font-weight:700;color:#666;cursor:pointer;padding:6px}
.navItem.active{color:#00ff85}
.navItem span{display:block;font-size:16px;margin-bottom:2px}
.refreshBar{height:0;overflow:hidden;background:#00ff85;color:#080808;text-align:center;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;transition:height 0.3s}
.refreshBar.show{height:36px}
</style>
</head>
<body>
<header>
  <div class="logo">GoalLine<small>BY JESSENDINHO</small></div>
  <div class="searchBox"><input id="search" placeholder="Search team..." oninput="filterSearch()"></div>
  <div class="dateBox">📅 <input type="date" id="dateInput" onchange="fetchGames()"></div>
  <div class="iconBtn" onclick="fetchGames(true)">↻</div>
</header>
<div id="statusBar" class="statusBar"><span class="dot"></span><span id="statusText">Connecting to old-poetry - LIVE...</span><span id="countdown" style="margin-left:auto;font-size:10px;opacity:0.7"></span></div>
<div id="pullBar" class="refreshBar">↻ Release to refresh</div>
<div class="filters">
  <div class="chip active" data-league="All" onclick="setLeague('All')">All</div>
  <div class="chip" data-league="Kenya PL" onclick="setLeague('Kenya PL')">Kenya PL</div>
  <div class="chip" data-league="EPL" onclick="setLeague('EPL')">EPL</div>
  <div class="chip" data-league="La Liga" onclick="setLeague('La Liga')">La Liga</div>
  <div class="chip" data-league="MLS" onclick="setLeague('MLS')">MLS</div>
  <div class="chip" data-league="UCL" onclick="setLeague('UCL')">UCL</div>
</div>
<main id="main"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
<nav class="bottomNav">
  <div class="navItem" onclick="setTab('Fav')"><span>⭐</span>Fav</div>
  <div class="navItem active" id="tabToday" onclick="setTab('Today')"><span>📅</span>Today</div>
  <div class="navItem" id="tabLive" onclick="setTab('LIVE')"><span style="color:#ff3b30">●</span>LIVE</div>
  <div class="navItem" onclick="setTab('Yesterday')"><span>🕘</span>Yesterday</div>
</nav>
<script>
const WORKER_URL = "https://old-poetry-cb6d.jessendinho.workers.dev"; 
const FALLBACK_WORKER = "https://old-poetry-cb6d.workers.dev";
let API_BASE = WORKER_URL;
let currentLeague = "All";
let currentTab = "Today";
let allGames = [];
let lastScores = {};
let countdownInterval = null;
let refreshSeconds = 15;
document.getElementById('dateInput').valueAsDate = new Date();
async function fetchGames(manual=false){
  const statusText = document.getElementById('statusText');
  const dateVal = document.getElementById('dateInput').value;
  statusText.textContent = manual ? "Refreshing..." : "LIVE syncing...";
  const urlsToTry = [
    `${API_BASE}/?date=${dateVal}`,
    `${API_BASE}/live`,
    `${API_BASE}/`,
    `${FALLBACK_WORKER}/?date=${dateVal}`,
    `${FALLBACK_WORKER}/live`
  ];
  let data = null;
  for(let url of urlsToTry){
    try{
      const res = await fetch(url, {cache:"no-store"});
      if(res.ok){
        const json = await res.json();
        if(json && (Array.isArray(json) || json.games || json.data || json.matches)){
          data = json;
          API_BASE = url.split('/?')[0].split('/live')[0];
          break;
        }
      }
    }catch(e){ continue; }
  }
  if(data){
    if(Array.isArray(data)) allGames = data;
    else if(data.games) allGames = data.games;
    else if(data.data) allGames = data.data;
    else if(data.matches) allGames = data.matches;
    else allGames = [];
  } else { allGames = []; }
  if(allGames.length===0 && currentTab!=="LIVE"){
    try{
      const liveRes = await fetch(`${API_BASE}/live`, {cache:"no-store"});
      if(liveRes.ok){
        const liveData = await liveRes.json();
        const liveGames = Array.isArray(liveData) ? liveData : (liveData.games||liveData.data||[]);
        if(liveGames.length>0){
          currentTab = "LIVE";
          document.getElementById('tabLive').classList.add('active');
          document.getElementById('tabToday').classList.remove('active');
          allGames = liveGames;
        }
      }
    }catch(e){}
  }
  renderGames();
  statusText.textContent = allGames.length>0 ? `✅ Connected to old-poetry - ${allGames.length} games - LIVE auto-refresh 15s` : `✅ Connected to old-poetry - LIVE scores active!`;
  resetCountdown();
}
function renderGames(){
  const main = document.getElementById('main');
  let filtered = allGames;
  if(currentLeague!=="All"){
    filtered = filtered.filter(g => {
      const l = (g.league||g.competition||"").toLowerCase();
      return l.includes(currentLeague.toLowerCase()) || (currentLeague==="Kenya PL" && l.includes("kenya"));
    });
  }
  const q = document.getElementById('search').value.toLowerCase();
  if(q){
    filtered = filtered.filter(g => {
      const home = (g.home||g.homeTeam||"").toLowerCase();
      const away = (g.away||g.awayTeam||"").toLowerCase();
      return home.includes(q) || away.includes(q);
    });
  }
  if(currentTab==="LIVE"){
    filtered = filtered.filter(g => {
      const s = (g.status||"").toLowerCase();
      return s.includes("live") || g.isLive || g.minute;
    });
  }
  if(filtered.length===0){
    main.innerHTML = `<div class="empty"><h3>No games in ${currentLeague}</h3><p>App auto-refreshes every 15s<br>Pull down to refresh<br>Tap LIVE tab for live games</p></div>`;
    return;
  }
  main.innerHTML = filtered.map(g=>{
    const home = g.home||g.homeTeam||"Home";
    const away = g.away||g.awayTeam||"Away";
    const hs = g.homeScore??g.score1??"-";
    const as = g.awayScore??g.score2??"-";
    const status = g.status||g.minute||"NS";
    const isLive = status.toLowerCase().includes("live") || status.includes("'") || g.isLive;
    const league = g.league||g.competition||"Football";
    const key = `${home}-${away}`;
    const old = lastScores[key];
    const isGoal = old && (old!==`${hs}-${as}`) && isLive;
    lastScores[key]=`${hs}-${as}`;
    return `<div class="card ${isLive?'live':''} ${isGoal?'flash':''}">
      <div class="league"><span>${league}</span><span style="color:${isLive?'#00ff85':'#666'}">${status}</span></div>
      <div class="matchRow">
        <div class="team">${home}</div>
        <div class="scoreBox ${isLive?'live':''}">${hs} - ${as}</div>
        <div class="team right">${away}</div>
      </div>
      <div class="time ${isLive?'live':''}">${isLive ? '● LIVE' : status}</div>
    </div>`;
  }).join('');
}
function setLeague(league){
  currentLeague = league;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.league===league));
  renderGames();
}
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.navItem').forEach(n=>n.classList.remove('active'));
  if(tab==="Today") document.getElementById('tabToday').classList.add('active');
  if(tab==="LIVE") document.getElementById('tabLive').classList.add('active');
  if(tab==="Today") document.getElementById('dateInput').valueAsDate = new Date();
  else if(tab==="Yesterday"){ const d=new Date(); d.setDate(d.getDate()-1); document.getElementById('dateInput').valueAsDate=d; }
  fetchGames();
}
function filterSearch(){ renderGames(); }
function resetCountdown(){
  refreshSeconds = 15;
  if(countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(()=>{
    refreshSeconds--;
    const el = document.getElementById('countdown');
    if(el) el.textContent = `↻ ${refreshSeconds}s`;
    if(refreshSeconds<=0){ fetchGames(); }
  },1000);
}
setInterval(()=>fetchGames(),15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) fetchGames(); });
let startY=0;
window.addEventListener('touchstart', e=>{ startY=e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchmove', e=>{
  const diff = e.touches[0].clientY - startY;
  const bar = document.getElementById('pullBar');
  if(diff>70 && window.scrollY===0){ bar.classList.add('show'); }
}, {passive:true});
window.addEventListener('touchend', ()=>{
  const bar = document.getElementById('pullBar');
  if(bar.classList.contains('show')){ fetchGames(true); setTimeout(()=>bar.classList.remove('show'),1000); }
}, {passive:true});
fetchGames();
</script>
