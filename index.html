<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>GoalLine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Goal<span>Line</span></h1>
  <div class="right">
    <a href="search.html" class="icon-btn" title="Search">🔍</a>
    <button id="notifBtn" class="icon-btn" title="Goal alerts">🔔</button>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
  </div>
</header>
<div id="demoBanner" class="banner" hidden>Demo data. Tap ⚙️ and paste your football-data.org key to go live.</div>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="matches" class="active">Matches</button>
  <button data-tab="tables">Tables</button>
  <button data-tab="favorites">Favorites</button>
</nav>
<div id="toast" class="toast" hidden></div>
<div id="settings" class="modal" hidden>
  <div class="box">
    <h2>Settings</h2>
    <p>Paste your free football-data.org API key to see real matches. It is saved only in this browser and is never uploaded. Leave empty for demo data.</p>
    <input id="keyInput" type="password" placeholder="API key" autocomplete="off">
    <div class="actions"><button id="cancelKey" class="btn">Cancel</button><button id="saveKey" class="btn primary">Save</button></div>
  </div>
</div>

<script src="data.js"></script>
<script src="demo.js"></script>
<script src="index.js"></script>
</body>
</html>
