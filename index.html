<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jeScores - Every Goal. Every Update.</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="jeScores">
<meta name="theme-color" content="#0a2e1c">
<style>
:root{--green:#0a2e1c;--gold:#e8b84b;--dark:#080808;--card:#121212;--border:#1e3d2a}
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:var(--dark);color:#fff}
header{background:var(--green);padding:10px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--gold)}
.je{color:var(--gold);font-weight:900}.scores{color:#fff;font-weight:900}
.small{font-size:7px;color:var(--gold);display:block;letter-spacing:1px}
.slogan{font-size:8px;color:var(--gold);font-style:italic;margin-top:1px}
.search{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:20px;padding:5px 10px}
.search input{border:none;background:transparent;outline:none;width:100%;color:#fff;font-size:12px}
.date{background:rgba(232,184,75,.15);border:1px solid var(--gold);border-radius:8px;padding:4px 6px;color:var(--gold);font-size:11px;font-weight:800}
.date input{border:none;background:transparent;color:var(--gold);font-weight:800;width:90px}
.status{background:#0a0a0a;color:var(--gold);text-align:center;padding:6px;font-size:10px;font-weight:700;border-bottom:1px solid var(--border)}
.filters{background:#0f0f0f;padding:8px;display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:9}
.chip{padding:5px 10px;border-radius:20px;background:#1a1a1a;color:#888;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid #2a2a2a;cursor:pointer}
.chip.on{background:var(--gold);color:#000}
#main{padding:10px;padding-bottom:90px;min-height:60vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.card.live{border-color:var(--gold)}
.top{font-size:8px;color:var(--gold);font-weight:800;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.team{flex:1;font-weight:700;font-size:13px}
.score{background:#000;border-radius:7px;padding:3px 8px;min-width:55px;text-align:center;font-weight:900;font-size:13px;border:1px solid var(--border)}
.score.live{color:var(--gold);border-color:var(--gold)}
.empty{text-align:center;padding:40px 12px;color:#777;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 9px;z-index:20}
.ni{flex:1;text-align:center;font-size:9px;color:#666;font-weight:700;cursor:pointer}
.ni.on{color:var(--gold)}
.ni span{font-size:16px;display:block}
.footer{text-align:center;padding:12px;color:#555;font-size:10px;border-top:1px solid var(--border)}
.footer b{color:var(--gold)}
</style>
</head>
<body>
<header>
<div><span class="je">je</span><span class="scores">Scores</span><span class="small">BY JESSENDINHO</span><div class="slogan">Every Goal. Every Update.</div></div>
<div class="search"><input id="q" placeholder="Search team..." oninput="render()"></div>
<div class="date"><input type="date" id="d"></div>
</header>
<div class="status" id="st">jeScores • Loading...</div>
<div class="filters" id="filters">
<div class="chip on" data-f="All" onclick="setL('All')">All</div>
<div class="chip" data-f="Kenya PL" onclick="setL('Kenya PL')">Kenya PL</div>
<div class="chip" data-f="EPL" onclick="setL('EPL')">EPL</div>
<div class="chip" data-f="La Liga" onclick="setL('La Liga')">La Liga</div>
<div class="chip" data-f="UCL" onclick="setL('UCL')">UCL</div>
</div>
<div id="main"></div>
<div class="footer"><b>jeScores</b> • <i style="color:var(--gold)">Every Goal. Every Update.</i> • By Jessendinho</div>
<div class="bottom">
<div class="ni on" id="n-home" onclick="setP('home')"><span>🏠</span>Home</div>
<div class="ni" id="n-scores" onclick="setP('scores')"><span>📊</span>Scores</div>
<div class="ni" id="n-comp" onclick="setP('comp')"><span>🏆</span>Comps</div>
<div class="ni" id="n-fav" onclick="setP('fav')"><span>⭐</span>Following</div>
</div>
<script>
var W="https://old-poetry-cb6d.jessegitonga04.workers.dev";
var games=[],curL="All",curP="home",fav=[];
document.getElementById("d").valueAsDate=new Date();
function load(){
 var main=document.getElementById("main");
 document.getElementById("st").innerHTML="jeScores • Loading REAL...";
 var date=document.getElementById("d").value;
 fetch(W+"/v3/fixtures?date="+date).then(function(r){return r.json()}).then(function(data){
  var fix=data.response||[];
  if(fix.length==0){
   var y=new Date();y.setDate(y.getDate()-1);
   var yS=y.toISOString().split("T")[0];
   return fetch(W+"/v3/fixtures?date="+yS).then(function(r){return r.json()}).then(function(data2){
    fix=(data2.response||[]).slice(0,40);
    if(fix.length==0){
     main.innerHTML='<div class=empty>No fixtures today<br>jeScores ready<br>Worker may need key<br><br><button onclick=load() style=padding:6px 12px;border-radius:20px;background:#121212;color:#e8b84b;border:1px solid #e8b84b>Retry</button></div>';
     document.getElementById("st").innerHTML="jeScores • No fixtures • API empty?";
     return [];
    }
    return fix;
   });
  }
  return fix;
 }).then(function(fix){
  if(fix.length>0){games=fix;document.getElementById("st").innerHTML="jeScores • "+fix.length+" matches • Every Goal. Every Update.";render();}
 }).catch(function(e){
  main.innerHTML='<div class=empty>Error: '+e.message+'<br><button onclick=load() style=margin-top:10px;padding:6px 12px;border-radius:20px;background:#121212;color:#e8b84b;border:1px solid #e8b84b>Retry</button></div>';
 });
}
function render(){
 if(curP!="home" && curP!="scores") return;
 var f=games;
 if(curL!="All"){
  f=f.filter(function(g){
   var n=(g.league.name||"").toLowerCase();
   if(curL=="Kenya PL") return n.indexOf("kenya")>-1;
   if(curL=="EPL") return n.indexOf("premier")>-1||g.league.id==39;
   if(curL=="La Liga") return n.indexOf("la liga")>-1||g.league.id==140;
   if(curL=="UCL") return n.indexOf("champions")>-1||g.league.id==2;
   return true;
  });
 }
 var q=document.getElementById("q").value.toLowerCase();
 if(q) f=f.filter(function(g){return (g.teams.home.name+g.teams.away.name).toLowerCase().indexOf(q)>-1;});
 if(f.length==0) f=games;
 var html="";
 for(var i=0;i<f.length;i++){
  var g=f[i];
  var live=g.fixture.status.short=="1H"||g.fixture.status.short=="2H"||g.fixture.status.short=="LIVE";
  var sc=g.fixture.status.short=="NS"?"vs":(g.goals.home!=null?g.goals.home:"-")+" - "+(g.goals.away!=null?g.goals.away:"-");
  html+='<div class="card '+(live?'live':'')+'"><div class=top><span>'+g.league.name+'</span><span style=color:'+(live?'#e8b84b':'#666')+'>'+g.fixture.status.short+'</span></div><div class=row><div class=team>'+g.teams.home.name+'</div><div class="score '+(live?'live':'')+'">'+sc+'</div><div class="team" style=text-align:right>'+g.teams.away.name+'</div></div><div style=text-align:center;font-size:9px;color:'+(live?'#e8b84b':'#666')+';margin-top:3px>'+(live?'LIVE • Every Goal. Every Update.':g.fixture.status.long)+'</div></div>';
 }
 document.getElementById("main").innerHTML=html||'<div class=empty>No matches after filter<br>Showing all</div>';
}
function setL(l){
 curL=l;
 var chips=document.querySelectorAll(".chip");
 for(var i=0;i<chips.length;i++){chips[i].classList.toggle("on",chips[i].getAttribute("data-f")==l);}
 render();
}
function setP(p){
 curP=p;
 var navs=["home","scores","comp","fav"];
 for(var i=0;i<navs.length;i++){document.getElementById("n-"+navs[i]).classList.toggle("on",navs[i]==p);}
 if(p=="home"||p=="scores"){
  document.getElementById("filters").style.display="flex";
  if(p=="scores"){document.getElementById("d").valueAsDate=new Date();load();} else {render();}
 } else if(p=="comp"){
  document.getElementById("filters").style.display="none";
  loadComps();
 } else if(p=="fav"){
  document.getElementById("filters").style.display="none";
  document.getElementById("main").innerHTML='<div class=empty>Following tab<br>Follow teams from match page<br><br>jeScores • Every Goal. Every Update.</div>';
 }
}
function loadComps(){
 var main=document.getElementById("main");
 main.innerHTML='<div class=empty>Loading competitions...<br>jeScores</div>';
 fetch(W+"/v3/leagues").then(function(r){return r.json()}).then(function(data){
  var leagues=data.response||[];
  if(leagues.length==0){
   main.innerHTML='<div class=empty>Comps API empty<br>Popular: EPL, La Liga, Kenya PL, UCL<br><br><button onclick=setP("home") style=padding:6px 12px;border-radius:20px;background:#121212;color:#e8b84b;border:1px solid #e8b84b>Back</button></div>';
   return;
  }
  var html='<div style=padding:5px 0><b style=color:#e8b84b>Competitions • jeScores</b></div>';
  for(var i=0;i<Math.min(leagues.length,50);i++){
   var l=leagues[i];
   html+='<div class=card><div class=top><span>'+(l.country.name||"World")+'</span><span>ID '+l.league.id+'</span></div><div class=row><div class=team>'+l.league.name+'</div><div style=font-size:11px;color:#e8b84b>Standings</div></div></div>';
  }
  main.innerHTML=html;
 }).catch(function(e){main.innerHTML='<div class=empty>Error: '+e.message+'<br><button onclick=loadComps()>Retry</button></div>';});
}
load();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</body>
</html>
